# 현실 배치 세계 — KABOAT 2025-11 규정 그림(종합임무 1경기장) 치수를 경기장 좌표계에 놓은 것.
#   full_course_sim.py --world tools/sim/worlds/arena_2025.yaml  (시뮬 전용, 대회 좌표 아님 — 합성, 실측 아님)
#
# 좌표계: 원점 = 경기장(점선 70 × 25 m) 왼쪽 아래 모서리, x = 동(70 m 변), y = 북(25 m 변), 단위 m.
#   위경도는 origin 에서 평면(등장방형) 변환 — full_course_sim.Geo 와 같은 식. 기준점 = 템플릿 WP0 좌표(아무 점).
#   🚨 경기장이 정동·정북으로 놓였다는 것도 가정이다(방위는 결과에 거의 영향 없음 — 노드는 상대각·GPS 만 본다).
#
# 그림에서 읽은 치수(12.4 px/m 로 잼, ±0.5 m)와 가정 — 2026 OT 그림은 없다:
#   · 게이트 5쌍: 쌍 간격 5 m(x = 7·12·17·22·27), 두 줄 사이 5 m(y = 3·8), 아래 줄은 경계에서 3 m.
#     ⚠️ 그림은 +x 로 갈 때 초록이 좌현(y = 8)이다. 노드 ship_gate red_on_port 기본 true(규정 '빨강 좌현')에
#        맞추려고 **색을 바꿔** 빨강 = y 8(좌현), 초록 = y 3 으로 둔다(가정 — 현장 공지 확인).
#   · 장애물 구역 30 × 12 m: x 5~35, y 11~23. 모서리 빨간 큰 부표 4개(반경은 sim 공통 0.2 m 로 둔다).
#     주황 격자 3 m: 가운데 세 줄 y = 14·17·20 (x = 12.5~27.5, 6개), 위 줄 y 23 (x 12.5·18.5·24.5),
#     아래 줄 y 11 (x 15.5·21.5·27.5) — 그림 그대로 24개.
#   · 위치유지 부표: 그림 오른쪽 아래 주황(x 50, 경계에서 5 m) = 2026 위치유지 1회 부표로 가정. sim 은 흰 부표로 둔다
#     (검출기 turn_color_mode2 = white 와 맞춤 — 색은 당일 공지).
#   · 탐색 부표: 그림 오른쪽 위 세 개 — 주황(49, 20)·초록(59, 20, 10 m 간격·경계에서 5 m)·빨강(54, 14, 6 m 아래).
#     2026 OT 탐색 색(빨강·초록·검정)에 맞춰 주황 → 검정으로 가정. WP 라벨 색 규칙(build_world)으로 만든다.
#   · 도크: 오른쪽 끝, 전체 12 m(y 0~12), 칸 3개 폭 2 m, 칸 사이·양 끝 1.5 m, 깊이 3 m, 입구는 서쪽(−x).
#     칸 안쪽 벽(뒷벽) x = 68, 칸 입구 선 x = 65. 칸 중심 y = 2.5·6·9.5 (칸 −1 = 남, 0 = 가운데, +1 = 북).
#   · 종료 게이트: 그림에 없다 → 장애물 구역 왼쪽 경계 밖 x = 0, y 14.5·19.5(폭 5 m)로 가정. 서쪽(−x)으로 지날 때
#     좌현 = 남 → 빨강 y 14.5.
#   · 출발: full_course_sim 기본 규칙(WP1→WP0 연장선 위 WP0 앞 8 m = 경기장 왼쪽 경계 밖 3.5 m).
#
# 웨이포인트 = KABOAT 2026 OT 순서 13점(템플릿 src/north_goal_angle/config/waypoints.yaml 과 같은 라벨·mode·dwell).
#   정렬점 = 가운데 칸 입구 정면 6 m(템플릿 방식). --dock-align target 이면 시뮬이 정렬·WP8·WP9 를 목표 칸 축으로 옮긴 사본을 쓴다.
#   위경도 파일(waypoints_file)은 이 파일에서 만든다:
#     python3 tools/sim/full_course_sim.py --world tools/sim/worlds/arena_2025.yaml --write-world-wp
name: arena_2025
origin: {lat: 35.1862375, lon: 128.5655118}
arena: [[0, 0], [70, 0], [70, 25], [0, 25]]
waypoints_file: arena_2025_wp.yaml

waypoints:
  - {구역: "WP0 게이트 시작",       xy: [4.5, 5.5],  mode: 0, dwell: 3.0}   # 첫 게이트(x 7) 앞 2.5 m, 두 줄 가운데
  - {구역: "WP1 게이트 끝",         xy: [29.5, 5.5], mode: 1, dwell: 3.0}   # 마지막 게이트(x 27) 뒤 2.5 m
  - {구역: "WP2 위치유지",          xy: [50.0, 5.0], mode: 2, dwell: 0.5}   # 위치유지 부표 자리
  - {구역: "도킹 정렬 6m",          xy: [59.0, 6.0], mode: 5, dwell: 1.0}   # 가운데 칸 입구(65, 6) 정면 6 m
  - {구역: "WP8 도킹(도크 정면)",   xy: [65.0, 6.0], mode: 7, dwell: 1.0}   # 가운데 칸 입구
  - {구역: "WP9 도킹 이탈",         xy: [59.0, 6.0], mode: 7, dwell: 1.0}   # 정렬 6m 과 같은 자리
  - {구역: "탐색 접근",             xy: [60.0, 12.0], mode: 5, dwell: 1.0}  # WP3 앞 8 m
  - {구역: "WP3 부표(초록)",        xy: [59.0, 20.0], mode: 3, dwell: 0.5}
  - {구역: "WP4 부표(빨강)",        xy: [54.0, 14.0], mode: 3, dwell: 0.5}
  - {구역: "WP5 부표(검정)",        xy: [49.0, 20.0], mode: 3, dwell: 0.5}
  - {구역: "WP6 회피 시작",         xy: [38.0, 17.0], mode: 5, dwell: 1.0}  # 구역 오른쪽 경계(x 35) 밖 3 m
  - {구역: "WP7 회피 끝",           xy: [2.0, 17.0],  mode: 5, dwell: 1.0}  # 구역 왼쪽 경계(x 5) 밖 3 m
  - {구역: "WP10 종료 게이트 너머", xy: [-4.0, 17.0], mode: 8, dwell: 3.0}  # 종료 게이트(x 0) 너머 4 m

gates:          # 지나는 순서. 빨강 = 진행 방향(+x) 좌현
  - {red: [7, 8],  green: [7, 3]}
  - {red: [12, 8], green: [12, 3]}
  - {red: [17, 8], green: [17, 3]}
  - {red: [22, 8], green: [22, 3]}
  - {red: [27, 8], green: [27, 3]}

buoys:          # 명시 부표(게이트·미션 부표 말고). kind 는 접촉 집계 이름: obst_5 = 장애물, gate_end = 게이트로 셈
  - {xy: [5, 11],  color: red, kind: obst_5}     # 장애물 구역 모서리
  - {xy: [35, 11], color: red, kind: obst_5}
  - {xy: [5, 23],  color: red, kind: obst_5}
  - {xy: [35, 23], color: red, kind: obst_5}
  - {xy: [0, 14.5], color: red, kind: gate_end}   # 종료 게이트(가정)
  - {xy: [0, 19.5], color: green, kind: gate_end}

obstacle_grid:  # 주황 장애물 — 행마다 y 와 x 목록
  - {y: 23, x: [12.5, 18.5, 24.5]}
  - {y: 20, x: [12.5, 15.5, 18.5, 21.5, 24.5, 27.5]}
  - {y: 17, x: [12.5, 15.5, 18.5, 21.5, 24.5, 27.5]}
  - {y: 14, x: [12.5, 15.5, 18.5, 21.5, 24.5, 27.5]}
  - {y: 11, x: [15.5, 21.5, 27.5]}

random_obstacles: false   # build_world 의 회피 선분 무작위 장애물(6~10개)을 끈다 — 위 격자가 장애물

dock:
  center: [68.0, 6.0]     # 칸 안쪽 벽(뒷벽) 중심
  facing_deg: 270.0       # 물 쪽(칸 입구) 방향, 나침반 ° (270 = 서)
  bay_w: 2.0
  gap: 1.5                # 칸 사이·양 끝 덩어리 폭
  depth: 3.0
  n_bays: 3

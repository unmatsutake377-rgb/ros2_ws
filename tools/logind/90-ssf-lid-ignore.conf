# SSF — 노트북 덮개를 닫아도 절전·종료하지 않는다 (배 위에서 덮개를 닫고 운용).
# 설치: sudo mkdir -p /etc/systemd/logind.conf.d && sudo cp tools/logind/90-ssf-lid-ignore.conf /etc/systemd/logind.conf.d/
# 적용: 재부팅 (systemd-logind 재시작은 데스크톱 세션을 끊을 수 있어 쓰지 않는다)
# 확인: busctl get-property org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager HandleLidSwitch  → "ignore"
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore

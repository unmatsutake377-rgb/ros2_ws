# SSF 파라미터 앱 — '오늘 시험' 탭 내용 (종합임무 두 배 테스트, 사용자 11-13·11-15 요청)
# 앱은 이 파일을 읽어 순서대로 보여 준다. 체크 표시는 보는 브라우저에만 저장된다(배·저장소엔 안 남음).
#   date / title / note : 탭 머리
#   tests[]             : id · title · why(왜 하나) · prep(준비) · steps[] · pass[](합격 기준) · record[](적을 것) · params[](관련 값 pkg/key)
#   steps[]             : text · cmd(선택 — {b} 는 배 글자 소문자 a/b, {B} 는 대문자 A/B 로 바뀐다)
# 🚨 여기 적는 건 절차·기준뿐 — 값은 각 패키지 config yaml 이 기준(앱 '현장 조정' 탭에서 바꾼다).
# 근거: waypoints.yaml 머리말(15점 순서), 계약서_GPS방위_20261114(출항 WP·gps_cog 출발 절차),
#       계약서_GPS위치유지_20261113(hold_source gps), 실해역_시험_정리 §9-0g(IMU)·§9-5(회피), 인식융합 계약(f04b9c7 롤백).
# 이전 내용(11-12 저녁: 라이다 부표 인식·회피·허브/IMU)은 git 기록에 있다.

date: "2026-11-15"
title: "종합임무 두 배 테스트 — 15점 녹화 · 장애물 구간 경계 · launch · 자율"
note: >-
  두 배 모두 같은 순서로 한다(배마다 결과를 따로 적는다). 값은 판과 판 사이에만, 모드 전환은 조종기로만.
  자율 중 이상하면 바로 SwD [위]. launch 는 앱 'launch' 탭(boat_boot 안 됐으면 켜기 버튼이 잠긴다).
  🚨 두 배 방위 출처가 같은지 먼저 본다(현장 조정 → 헤딩 묶음 '방위 출처'). 다르면 출발 절차가 배마다 다르다.

tests:
  - id: setup
    title: "1. 출발 전 — 장치·boat_boot·공지 값"
    why: >-
      USB 장치 하나라도 빠지면 그 판 전체가 틀린다. boat_boot 는 재부팅마다 풀린다. 색·도형은 당일 공지로 바꾼다.
    prep:
      - "센서·D455·아두이노(노트북 직결) 연결, 조종기 새 건전지(켤 때 스위치 전부 위 + 스로틀 맨 아래)"
      - "공지: 탐색 부표 색, 도킹 표식 색·도형, 목표 칸"
    steps:
      - text: "장치 확인 — IMU·Mega·라이다·GPS 가 다 보이는지"
        cmd: "lsusb; ls -l /dev/IMU /dev/ttyMEGA /dev/ttyUSB*"
      - text: "boat_boot (MacBook 터미널, 그 배 비밀번호) — 앱 launch 탭의 boat_boot 줄이 ✅ 가 될 때까지"
        cmd: "ssh -t boat-{b} 'hostname; sudo ~/ros2_ws/tools/boat_boot.sh'"
      - text: "공지 값 넣기(앱 현장 조정): 탐색 turn_color_mode3 · 도킹 target_color·target_shape. 게이트 red_on_port(진행 방향 왼쪽 초록 = false) 확인"
      - text: "배 노트북 별도 터미널에 커널 로그 — 판 내내 켜 둔다(허브 끊김 확인)"
        cmd: "journalctl -k -f | tee ~/ssf_logs/kern_main_$(date +%H%M).log"
    pass:
      - "장치 전부 보임 · boat_boot ✅ · 공지 값 반영"
    record:
      - "공지 값, boat_boot 시각, 장치 누락 여부"
    params:
      - color_shape_detector/turn_color_mode3
      - color_shape_detector/target_color
      - color_shape_detector/target_shape
      - ship_gate/red_on_port

  - id: record
    title: "2. 웨이포인트 15점 녹화"
    why: >-
      템플릿 순서(엔터 기본값): 출항 → 게이트 시작·끝 → 위치유지 → 도킹 정렬 6m → 도크 정면 → 도킹 이탈 → 탐색 접근 → 탐색 3 →
      장애물 구간 접근(1번배 11-12 A7 자리) → 회피 시작·끝 → 종료 게이트 너머. 앱 '웨이포인트' 탭 맨 위 표에 점마다 하는 일·머무는 시간·찍는 자리.
    prep:
      - "🚨 찍기 직전마다 앱 맨 위 GPS = RTK FIXED 인지 눈으로 — 녹화 도구는 FIXED 아니어도 찍는다(경고만). 배를 멈추고 몇 초 머문 뒤 찍는다"
    steps:
      - text: "녹화 시작(앱 웨이포인트 탭 → 종합임무, 또는 아래 명령)"
        cmd: "ssf {b} wp main"
      - text: "출항 = 출발 자리(ㄷ자) 뚫린 면 바깥 2~3 m. 위치유지 = 부표 옆 대기점 약 1.5 m(조류 아래쪽)"
      - text: "도킹 세 점은 목표 칸 축: 정렬 6m = 그 칸 입구 정면 6 m · 도크 정면 = 그 칸 입구 · 이탈 = 정렬점 자리(공지 전이면 가운데 칸, 공지 뒤 r N 으로 다시)"
      - text: "장애물 구간 접근 = 장애물 구간 경계 밖, 회피 시작 앞. 회피 시작·끝은 경계에서 3 m 이상 안쪽, 종료 게이트 너머는 구역 밖"
      - text: "저장(q) 뒤 웨이포인트 탭 '다시 검사' — 15점 · mode 순서 [5, 0, 1, 2, 5, 7, 7, 5, 3, 3, 3, 5, 5, 5, 8] · 경고 없음"
    pass:
      - "15점, 템플릿과 mode 순서 같음, 오류·경고 없음"
      - "(1번배) 기준점 WP0·WP1·WP2(11-12)와 거리 차 수십 cm 안 — Claude 에게 '기준점 비교'"
    record:
      - "녹화본 파일 이름·시각, FIXED 아닌 채 찍은 점(있으면)"
    params:
      - ship_back/hold_source
      - ship_back/gps_hold_time_sec
      - ship_back/gps_keep_radius_m

  - id: fence
    title: "3. 장애물 구간 경계"
    why: >-
      장애물 구간을 벗어나면 실격. 경계 폴리곤은 회피 WP(구역 안 mode 5)에서만 켜진다. 반폭 5 m 미만이면 시뮬상 오히려 손해 → 비운다.
    steps:
      - text: "앱 현장 조정 → 경계(지오펜스) → 장애물 구간 경계: 구역 꼭짓점마다 배를 대고 '📍 지금 위치를 꼭짓점으로' 4점(한 방향 순서) → 적용"
      - text: "(좌표 있으면) 전체 경계 geofence_polygon(종합). 없으면 비워 둔다"
    pass:
      - "다음 launch 시작 로그 '🚧 장애물 구간 경계 ON(4점) — 켜는 WP: …' 에 회피 시작·끝(12·13)만 있고, 출항·도킹 정렬·탐색 접근·장애물 구간 접근은 없음"
      - "'가장자리 3 m 이내' WARN 없음"
    record:
      - "꼭짓점 4점 좌표·반폭"
    params:
      - north_goal_angle/geofence_avoid_polygon
      - north_goal_angle/geofence_polygon

  - id: launch_heading
    title: "4. launch · 방위"
    why: >-
      두 배가 같은 방위 출처여야 같은 절차로 출발한다. imu_relative 는 IMU 전원마다 기준이 바뀌고(§9-0g), gps_cog 는 0.5 m/s 넘게 직진해야 방위가 잡힌다.
    steps:
      - text: "앱 launch 탭: 코스 종합임무 · 웨이포인트 오늘 녹화본 → 켜기. 문제 시 '롤백' 체크(융합·뎁스 끔, Sensitivity). 터미널로 할 때:"
        cmd: "ros2 launch launch_files launch_files.launch.py boat:={B} course:=main waypoints_file:=$HOME/ssf_logs/waypoints_recorded.yaml"
      - text: "시작 로그(launch 탭 🔎 줄): 웨이포인트 15개 · yaw_mux source · hold_source=gps · red_on_port=False · 라이다 scan mode · distance_source · reverse_trim_us=0"
      - text: "배터리: 조종기 수동에서 1·2번 → 5·6번 → 삑 → 15~25 s"
      - text: "imu_relative 면: 수동 전진만 0.8 m/s 이상 30~40 s → /heading_status 의 R ≥ 0.9 · off=X → mount_offset_deg 에 X → launch 다시 켜기"
        cmd: "ros2 topic echo /heading_status"
      - text: "gps_cog 면: MANUAL 로 출발 자리 → 뱃머리를 출항 WP 쪽으로 → (출발 때) AUTO → 0.5 m/s 넘게 직진 → 로그 '첫 COG 채택'"
    pass:
      - "로그 항목 전부 기대값, ERROR 없음, 커널 로그 USB disconnect / error -71 없음"
      - "방위: /imu/yaw 가 휴대폰 방위 ±10° 안"
    record:
      - "방위 출처, off 값(imu_relative), 롤백 여부"
    params:
      - ssf_heading/heading_source
      - ssf_heading/mount_offset_deg
      - ssf_heading/gps_cog_min_speed_mps

  - id: run
    title: "5. 종합임무 자율"
    why: "15점 전체를 끝까지. 판마다 launch 를 다시 켜야 웨이포인트가 처음부터 시작한다."
    steps:
      - text: "출발 = 조종기 SwD [아래]. 끝(종료 게이트 너머) 도착 → 정지 → 조종기로 받아 복귀"
      - text: "판 사이: launch 탭 끄기(Ctrl+C) → '■ launch 끝' → 다시 켜기"
      - text: "기록(인식 융합 — 블랙박스에 없음)"
        cmd: "ros2 bag record -o ~/ssf_logs/main_{B}_$(date +%H%M) /fused_objects /fusion_status /scan"
    pass:
      - "출항: 뚫린 쪽으로 곧게 나가 출항 WP 도착"
      - "위치유지: WP2 반경 안 연속 판정 시간 → 다음 WP"
      - "도킹: 칸 안쪽 벽까지 들어간 뒤 후진(입구에서 후진 = 거짓 접안), 후진 뒤 칸을 빠져나옴"
      - "탐색: 공지 색 방향으로 원 선회 · 회피: 접촉 0, 구역 이탈 0 · 종료 게이트 너머 정지"
      - "앞에 아무것도 없는데 /fused_objects 정면 뎁스 물체 상시 → 수면 반사 → 다음 판 롤백"
    record:
      - "판·배별 미션 결과(게이트·위치유지·도킹·탐색·회피·종료), 접촉 위치(정면/옆/뒤), 걸린 시간"
      - "이상 로그·시각, bag 이름"
    params:
      - ship_direction/dwa_enabled
      - ship_dock/backoff_dist_m

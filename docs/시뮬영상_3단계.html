  for(let g=Math.ceil(B.y0/5)*5;g<B.y1;g+=5){const[,y]=px(0,g);cx.beginPath();cx.moveTo(0,y);cx.lineTo(cv.width,y);cx.stroke();
    cx.setLineDash([]);cx.fillStyle='#c9c7bf';cx.font='16px sans-serif';cx.textAlign='left';cx.fillText(g+'m',6,y-5);cx.setLineDash([4,7]);}
  cx.setLineDash([]);
  const[gx,gy]=px(d.g[0],d.g[1]);
  cx.strokeStyle='#378ADD';cx.lineWidth=3;cx.beginPath();cx.arc(gx,gy,15,0,7);cx.stroke();
  cx.beginPath();cx.moveTo(gx-9,gy);cx.lineTo(gx+9,gy);cx.moveTo(gx,gy-9);cx.lineTo(gx,gy+9);cx.stroke();
  cx.fillStyle='#8f8f88';cx.font='18px sans-serif';cx.textAlign='center';cx.fillText('목표',gx,gy-26);
  d.b.forEach(v=>{const[a,c]=px(v[0],v[1]);cx.fillStyle='#E24B4A';cx.beginPath();
    cx.arc(a,c,Math.max(8,v[2]*S),0,7);cx.fill();cx.strokeStyle='#A32D2D';cx.lineWidth=2;cx.stroke();});
  cx.strokeStyle='#8f8f88';cx.lineWidth=2.5;cx.beginPath();
  for(let k=0;k<=i;k++){const[a,c]=px(d.f[k][1],d.f[k][2]);k?cx.lineTo(a,c):cx.moveTo(a,c);}cx.stroke();
  const f=d.f[i],[bx,by]=px(f[1],f[2]);
  if(f[6]>0){cx.strokeStyle='#EF9F27';cx.lineWidth=2;cx.setLineDash([6,6]);
    cx.beginPath();cx.arc(bx,by,f[6]*S,0,7);cx.stroke();cx.setLineDash([]);}
  const stop=f[4]===1500&&f[5]===1500;
  cx.save();cx.translate(bx,by);cx.rotate(f[3]*Math.PI/180);
  cx.fillStyle=f[7]>=3?'#E24B4A':(stop?'#BA7517':'#1D9E75');
  cx.beginPath();cx.moveTo(0,-22);cx.lineTo(14,18);cx.lineTo(0,10);cx.lineTo(-14,18);cx.closePath();cx.fill();
  cx.restore();
}
function upd(){
  const f=d.f[i];
  $('m-t').textContent=f[0].toFixed(1)+'s';
  $('m-o').textContent=f[6]>0?f[6].toFixed(2)+'m':'없음';
  $('m-p').textContent=f[4]+' / '+f[5];
  const stop=f[4]===1500&&f[5]===1500, fwd=1500-(f[4]+f[5])/2;
  $('m-st').textContent=stop?'🛑 중립 (정지)':(fwd>=135?'전속 전진':'감속 '+Math.round(fwd/140*100)+'%');
  $('m-fs').textContent=f[7]>=3?'L3 정지':(f[7]>=1?'L'+f[7]+' 경고':'L0 정상');
  $('fsbox').style.background=f[7]>=3?'#FCEBEB':'#fff';
  $('m-fs').style.color=f[7]>=3?'#A32D2D':'#1a1a18';
  $('m-h').textContent=d.e.filter(e=>e.kind==='hit'&&e.t<=f[0]).length+'회';
  const ev=d.e.filter(e=>e.t<=f[0]).slice(-1)[0];
  $('evt').textContent=ev?ev.t.toFixed(1)+'s — '+ev.msg:'';
  $('scrub').value=i;draw();
}
function tick(){if(!playing)return;i+=spd;
  if(i>=d.f.length){i=d.f.length-1;playing=false;$('play').textContent='▶';}
  upd();requestAnimationFrame(tick);}
$('play').onclick=()=>{if(i>=d.f.length-1)i=0;playing=!playing;
  $('play').textContent=playing?'❚❚':'▶';if(playing)requestAnimationFrame(tick);};
$('scrub').oninput=e=>{i=+e.target.value;upd();};
$('spd').onchange=e=>{spd=+e.target.value;};
function load(k){key=k;d=DATA[k];i=0;playing=false;$('play').textContent='▶';
  $('scrub').max=d.f.length-1;
  Object.keys(DATA).forEach(x=>$('tab-'+x).className = x===k?'on':'');
  fit();upd();}
load(key);
</script></body></html>

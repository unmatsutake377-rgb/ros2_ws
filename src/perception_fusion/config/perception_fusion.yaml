# perception_fusion — LiDAR 군집 + D455 뎁스 덩어리 + OAK 검출 방위(색) (+ P1 단안·삼각측량, 기본 꺼짐) → /fused_objects
# (계약서_인식융합_20261112 §4·§5·§6·§10, 근거 계약서_거리융합_20261112 §4·§5)
#
# 🚨 코드 기본값(perception_fusion.py declare_parameter) == 이 파일 == fusion_logic.DEFAULTS.
#    test_fusion_params.py 가 셋을 묶는다. 소수점을 지킨다(3.0 ↔ 3 은 부팅 실패).
# 🚨 대회 사용은 물 위 실측 0회 상태(§10). 미션 노드 기본 distance_source: fused(11-14 계약서_흰부표_거리융합_v3 G-9), 어긋나면 LiDAR(disagree_policy).
#    롤백: launch perception_fusion:=false d455_depth:=false, 또는 미션 yaml distance_source: lidar.
/perception_fusion:
  ros__parameters:
    # D455 뎁스(launch d455_depth:=true, name=camera·namespace=camera → /camera/camera/...)
    depth_topic: "/camera/camera/depth/image_rect_raw"   # ⚠️ Ubuntu 에서 ros2 topic list 로 확인
    depth_info_topic: "/camera/camera/depth/camera_info"
    publish_hz: 10.0                # /fused_objects 고정주기 타이머
    status_hz: 1.0                  # /fusion_status
    lidar_stale_sec: 0.5            # 넘으면 뎁스만으로(flags bit1). 둘 다 넘으면 발행 중단
    depth_stale_sec: 0.5
    det_stale_sec: 0.7              # 검출기 방위(색 붙이기) 신선도
    warn_period_sec: 5.0            # 입력 stale WARN 주기
    lidar_half_fov_deg: 90.0        # 정면 ±90° 만 물체로
    cluster_gap_deg: 2.0            # 군집: 이웃 점 간격(각)
    cluster_gap_m: 0.3              # 군집: 이웃 점 거리 차
    cluster_min_points: 2           # 🚨 정수
    fusion_margin_deg: 3.0          # LiDAR 군집 ↔ 뎁스 덩어리 방위 구간 겹침 여유
    color_match_deg: 3.0            # 검출기 방위 ↔ 물체 방위 구간 여유(색 붙이기)
    weight_min: 0.3                 # 일치할 때 가중평균 w(LiDAR) 하한
    weight_max: 0.7
    agree_abs_m: 0.3                # 일치 = |dL − dD| ≤ max(agree_abs_m, agree_rel·min)  ⚠️ 실측 필요
    agree_rel: 0.1                  # ⚠️ 실측 필요
    disagree_penalty: 0.1           # 어긋남 때 conf 감점(정책과 무관하게 min(conf) − 이 값)
    disagree_policy: "lidar"        # 어긋남 때 거리: "lidar" = LiDAR 값(카메라 버림, G-5) / "min" = 가까운 값(11-12 규칙)
    conf_window_frames: 10          # 🚨 정수. 신뢰도 = 소스별 최근 N 프레임
    conf_mad_ref_m: 0.3             # 신뢰도: MAD 가 이 값이면 안정도 −0.5
    conf_jump_m: 0.5                # 신뢰도: 프레임 간 이 이상 변하면 점프
    depth_min_m: 0.5                # ⚠️ 실측 필요 (D455 최소 거리)
    depth_max_m: 6.0                # ⚠️ 실측 필요 (물 위 신뢰 거리)
    depth_row_lo_frac: 0.4          # 뎁스 열 거리에 쓰는 행 띠(위 0 ~ 아래 1). 수면 띠 제거  ⚠️ 실측 필요
    depth_row_hi_frac: 0.6          # ⚠️ 실측 필요 (카메라 높이·피치)
    depth_min_valid_frac: 0.3       # 열마다 띠 안 유효 픽셀(0 아님) 비율 하한  ⚠️ 실측 필요
    cam_x_from_lidar_m: 0.0         # D455 위치(LiDAR 기준, 앞 +)  ⚠️ 실측 필요
    cam_y_from_lidar_m: 0.0         # D455 위치(LiDAR 기준, 왼쪽 +)  ⚠️ 실측 필요
    cam_yaw_offset_deg: 0.0         # D455 장착 요(왼쪽 +)  ⚠️ 실측 필요
    # ---- P1 단안·삼각측량 (계약서_흰부표_거리융합_v3 B-2 + '수식 정밀화', 11-14) ----
    # 🚨 입력 /oak_detections 발행자(D1 image_subscriber_objects)는 아직 없다. 둘 다 false 면 출력은 P1 이전과 비트 동일.
    #    켜기 = P2(rosbag·그림자 비교 뒤). 롤백 = false 한 줄 + launch 재시작.
    # 🚨 아래 장착값: oak_cam_h_m·oak_pitch_deg = 마스트 설계값(mast v2, 11-14 사용자 결정 — 실측 아님), 나머지는 가정값
    #    (⚠️ 실측 필요). 배별 값 통로(G-4 perception_fusion_A/B.yaml)는 아직 없다 → 두 배 공용 값.
    use_mono: false                 # OAK 단안 수면 교점 거리
    use_triangulation: false        # OAK 방위 + RTK GPS 기선 삼각측량 거리
    oak_cam_h_m: 0.415              # OAK 렌즈 수면 위 높이(m). 설계값(mast v2), 실측 아님 ⚠️ — 두 배 공통, ship_avoid cam_h 와 같은 값
    oak_cam_h_sigma_m: 0.05         # 높이 σ(흘수·적재 변화)  ⚠️ 실측 필요
    oak_pitch_deg: 11.0             # OAK 장착 피치(아래 +). 설계값(mast v2), 실측 아님 ⚠️ — 두 배 공통. 1° 오차가 3 m 에서 약 0.4 m
    oak_roll_deg: 0.0               # OAK 장착 롤(우현 아래 +)  ⚠️ 실측 필요
    oak_x_from_lidar_m: 0.0         # OAK 위치(LiDAR 기준, 앞 +)  ⚠️ 실측 필요
    oak_y_from_lidar_m: 0.0         # OAK 위치(LiDAR 기준, 왼쪽 +)  ⚠️ 실측 필요
    oak_yaw_offset_deg: 0.0         # OAK 장착 요(왼쪽 +). 1번배 약 −4°(U3 리뷰) — 배별, 공용 0.0  ⚠️ 실측 필요
    oak_fy_px: 513.0                # OAK fy(px) — 픽셀 σ 를 정규 좌표로. 640x360 HFOV 63.9° 계산값  ⚠️ camera_info K[4] 확인
    mono_pitch_sigma_deg: 2.0       # 단안 피치·롤 σ(도, 공통). ship_avoid pitch_sigma_move 와 같은 보수값  ⚠️ 실측 필요
    mono_pixel_sigma: 2.0           # 바닥 행·가운데 열 검출 σ(px)  ⚠️ 실측 필요
    mono_max_range_m: 8.0           # 단안 거리 상한(넘으면 안 냄)  ⚠️ 실측 필요
    imu_stale_sec: 0.5              # /imu/data 이보다 묵으면 장착값만(WARN 1회)
    imu_pitch_sign: 1.0             # /imu/data 피치 부호(선수 숙임 = + 가 되게, 1.0|−1.0)  ⚠️ 실측 필요(iahrs 미발행)
    imu_roll_sign: 1.0              # /imu/data 롤 부호(우현 아래 = +)  ⚠️ 실측 필요
    gps_to_cam_x_m: 0.0             # GPS 안테나 → OAK 레버암(앞 +)  ⚠️ 실측 필요
    gps_to_cam_y_m: 0.0             # GPS 안테나 → OAK 레버암(왼쪽 +)  ⚠️ 실측 필요
    tri_min_baseline_m: 0.8         # 삼각측량 안테나 기선 하한
    tri_min_parallax_deg: 5.0       # 삼각측량 시차 하한(정면 접근 = 0 → 안 냄)
    tri_max_dt_s: 3.0               # 두 관측 시간차 상한(yaw 상대 드리프트 상쇄)  ⚠️ 실측 필요
    tri_assoc_deg: 5.0              # 같은 물체 트랙: 세계 방위 차 상한  ⚠️ 실측 필요
    tri_pose_max_gap_s: 0.3         # 촬영 시각 ↔ GPS·yaw 표본 간격 상한(넘으면 그 광선 버림)
    tri_yaw_sigma_deg: 0.5          # 짧은 시간 yaw 상대 σ  ⚠️ 실측 필요
    tri_rtk_max_sigma_m: 0.05       # RTK FIXED 판정 σ 상한(mission_view 08-07 실측 FIXED ±0.015 / float ±0.10)
    tri_max_range_m: 15.0           # 삼각측량 거리 상한  ⚠️ 실측 필요
    lidar_sigma_m: 0.05             # 카메라 ↔ LiDAR 게이팅용 LiDAR σ  ⚠️ 실측 필요
    depth_sigma_k: 0.005            # D455 σ = k·d² (카메라 소스와 가중·게이팅할 때만)  ⚠️ 실측 필요
    fusion_gate_sigma: 3.0          # 게이팅: |a − b| ≤ 이 값·√(σa² + σb²)
    # ---- P1b (11-14 리뷰 메모) ----
    gps_period_s: 1.0               # GPS /fix 주기(s). zed_f9p_rover.yaml rate 1.0 Hz — 보간 간격 상한 1.5×, 대기 만료 2×
    tri_interp_sigma_frac: 0.1      # GPS 보간·외삽 σ 항 = 이 값 × |v| × 가까운 표본까지 시간  ⚠️ 실측 필요
    tri_pending_max: 45             # 🚨 정수. GPS 표본을 기다리는 /oak_detections 메시지 수 상한(15 Hz × 3 s)
    tri_parallax_sigma_k: 2.0       # 시차 판정 = |Δα| − 이 값·√2·σα ≥ tri_min_parallax_deg (문턱 근처 선택 편향 방지)
    tri_max_rays: 8                 # 🚨 정수(≥ 3). 트랙당 광선 상한 — 넘으면 시간·기선 간격이 가장 촘촘한 가운데 광선을 솎음
    cam_max_rel_sigma: 0.3          # 단안·삼각측량 σ/d 가 이보다 크면 그 측정을 안 씀(정보 없음 = 3σ 게이트가 늘 '합의')  ⚠️ 실측 필요

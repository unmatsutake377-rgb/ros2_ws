# ship_back 파라미터 (하드코딩 금지, CLAUDE.md 1-4)
/ship_back:
  ros__parameters:
    # search_behavior 기본 orbit(2026-11 경기규정): 위치유지(2)만 담당, 탐색(3)은 ship_turn 선회.
    #   hold 옵션이면 launch 가 [2, 3] 을 넘긴다. 🚨 빈 리스트 금지.
    active_wp_modes: [2]
    period_sec: 0.1

    # ---- 위치유지 (규정: 부표 5m 이내 5초) ----
    keep_radius_m: 5.0       # 규정 성공 반경 (이 안에 연속으로 머물면 카운트)
    hold_time_sec: 5.0       # 규정 유지 시간
    hold_dist_m: 2.5         # ⚠️ 실측 필요 — 능동 유지 목표 거리(충돌 여유 + 5m 안을 동시에 만족)
    dist_tol_m: 0.4          # 데드밴드(±). 벗어나면 전/후진으로 되돌린다(표류를 ~tol 로 제한)

    # ---- 위치유지 출처 (계약서_GPS위치유지_20261113, 사용자 결정 11-13) ----
    # gps = mode 2 를 'WP 반경에 들어가면 GPS(/goal_distance) 기준 정지 유지'로 돈다(기본, 코드 기본값과 같이 고칠 것).
    #   SEARCH 20000(north 가 WP 로) → 거리 < gps_enter_m 이면 정지(50000) → 거리 > gps_resume_m 이면 < gps_enter_m
    #   까지 20000(재접근) → gps_keep_radius_m 안 연속 gps_hold_time_sec 이면 완료. 180(후진)·조향각은 안 낸다.
    #   ⚠️ 위치유지 WP 는 부표 좌표가 아니라 부표 옆 2~3 m 물 위 대기점에 찍는다(GPS 지연 ~1 m + 관성 → 접촉 위험).
    # vision = 부표 색(검출기 turn_color_mode2) + LiDAR 거리 능동 유지(위 hold_dist_m, 옛 동작). 롤백 = 이 한 줄.
    #   잘못된 값 → ERROR 후 gps. search_behavior:=hold 의 mode 3 은 이 값과 무관하게 vision.
    hold_source: "gps"
    # 🚨 gps_enter_m ≥ north arrive_radius_hold_modes_m(3.5), gps_resume_m ≥ gps_enter_m,
    #    gps_keep_radius_m > gps_resume_m — 어기면 시작 ERROR + 셋 모두 기본값.
    #    (enter < 3.5 면 20000 동안 north 가 3.5 m 안 dwell 0.5 s 로 WP 를 넘겨 정지 전에 끝난다)
    gps_enter_m: 3.5         # 이 거리 미만이면 정지 시작 / 재접근 끝
    gps_resume_m: 4.0        # 정지 중 이 거리 초과면 재접근 (히스테리시스)
    gps_keep_radius_m: 4.5   # 판정 반경 — 규정 5 m 보다 안쪽(GPS 필터 지연 ⚠️ 미실측)
    gps_hold_time_sec: 6.0   # 판정 시간 — 규정 5 s + 여유. 반경을 벗어나면 0 부터
    goal_dist_stale_sec: 2.0 # /goal_distance 가 이보다 묵으면 모름 → 정지, unknown_giveup_sec 뒤 포기

    # ---- 탐색/신선도 ----
    # SEARCH 시간 초과로 DONE 래치할지(계약 전체코스 §2-4). false(기본) = 계속 SEARCH(20000),
    #   다음 WP 진행은 north 의 WP 시간 초과. true 면 옛 동작(search_timeout_sec 뒤 DONE).
    search_timeout_ends: false
    search_timeout_sec: 20.0 # search_timeout_ends: true 일 때만 쓴다
    lost_sec: 2.0            # 부표를 이 시간 넘게 놓치면 SEARCH 로
    # LiDAR 전방 최근접으로 획득(SEARCH→HOLD)할지(§2-5). false(기본) = 비전 색 확인으로만 획득,
    #   LiDAR 최근접은 HOLD 중 직전 비전 방위가 lost_sec 안일 때 보조. true 면 옛 동작.
    lidar_acquire: false
    # HOLD 에서 거리 'unknown'(LiDAR 가 부표를 못 봄)이 이 시간 이어지면 포기 → DONE(20000), ERROR 1회.
    #   거리가 다시 잡히면 리셋. (계약 전체코스 §10-추가 결정 4)
    unknown_giveup_sec: 10.0
    # 한 WP(담당 모드 진입)에서 HOLD 시간 합이 이 값에 닿으면 포기 → DONE(20000), ERROR 1회.
    #   HOLD↔SEARCH 를 오가도 합산, 모드 진입 때만 0. (계약 전체코스 §10-추가 결정 5)
    #   아래 재획득 정지 창(STOP_HOLD) 시간도 합에 든다 — 창 중에도 판정해 넘으면 DONE.
    #   창이 끝나 20000(SEARCH)으로 간 뒤 시간은 안 듦. (결정 6 보충 ①)
    hold_max_sec: 60.0
    # HOLD 에서 놓쳐(lost_sec) SEARCH 로 갈 때 이 시간 동안 20000 대신 STOP_HOLD — 제자리에서 다시 찾음.
    #   그 안에 비전 재획득 → HOLD(합 이어 셈, 창 시간도 hold_max_sec 합에 듦), 못 잡으면 20000
    #   → north 진행. 0 이면 끔(옛 동작).
    #   첫 SEARCH(INIT·모드 진입 뒤)는 해당 없음(20000). (계약 전체코스 §10-추가 결정 6)
    reacquire_stop_sec: 5.0
    angle_stale_sec: 1.0
    scan_stale_sec: 1.0
    lidar_match_half_deg: 3.0   # 부표 방위 ±이 각도의 LiDAR 최소거리
    front_sector_half_deg: 30.0 # HOLD 보조(위 lidar_acquire): LiDAR 전방 ±이 각도 최근접을 부표로

    # ---- 거리 출처 (계약서_인식융합_20261112 §10 — CLAUDE.md §3 '거리는 LiDAR' 원칙의 승인된 예외) ----
    # lidar = /scan 만(옛 동작, /fused_objects 구독도 안 만듦) / fill = LiDAR 먼저, LiDAR 가 못 볼 때(None)만
    #   /fused_objects(perception_fusion) 거리 / fused = /fused_objects 먼저, 맞는 물체 없으면 LiDAR.
    #   잘못된 값 → ERROR 후 lidar. 볼 차례에 /fused_objects 가 없거나 묵으면(fused_stale_sec) LiDAR 거리만 + 5 s 주기 WARN.
    #   기본 = fused(계약서_흰부표_거리융합_v3 G-9, 11-14). 지금 perception_fusion 은 LiDAR+D455 융합뿐(단안·삼각측량 없음,
    #   물 위 실측 0회). perception_fusion 이 꺼졌거나 묵으면 lidar 와 같은 거리. 롤백 = lidar 한 줄(옛 대회값 fill).
    #   코드 기본값과 같이 고칠 것. LiDAR 우선(G-5): fused 라도 depth(D455 단독) 물체는 이 노드 LiDAR 가 못 볼 때만
    #   채운다(LiDAR 값이 있으면 LiDAR). src 4·5(단안·삼각측량 단독)는 fused_allowed_sources 에 넣지 않는다(G-7).
    distance_source: "fused"
    fused_topic: "/fused_objects"
    fused_stale_sec: 0.5     # ⚠️ 실측 필요 — 마지막 정상 수신 뒤 이보다 묵으면 안 쓴다
    fused_match_deg: 5.0     # ⚠️ 실측 필요 — 카메라 방위 ±이 각도 안의 물체만(그중 방위 최근접 하나)
    fused_min_conf: 0.5      # ⚠️ 실측 필요 — 고른 물체의 conf 가 이보다 낮으면 안 씀(다른 물체로 안 넘어감)
    fused_allowed_sources: ["lidar", "fused", "depth"]   # 쓸 물체 출처(row 제외, §10 Q3)

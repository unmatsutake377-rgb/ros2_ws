# ship_back 파라미터 (하드코딩 금지, CLAUDE.md 1-4)
/ship_back:
  ros__parameters:
    # search_behavior 기본 orbit(2026-11 경기규정): 위치유지(2)만 담당, 탐색(3)은 ship_turn 선회.
    #   hold 옵션이면 launch 가 [2, 3] 을 넘긴다. 🚨 빈 리스트 금지.
    active_wp_modes: [2]
    period_sec: 0.1

    # ---- 위치유지 (규정: 부표 5m 이내 5초) ----
    keep_radius_m: 5.0       # 규정 성공 반경 (이 안에 연속으로 머물면 카운트)
    hold_time_sec: 5.0       # 규정 유지 시간
    hold_dist_m: 2.5         # ⚠️ 실측 필요 — 능동 유지 목표 거리(충돌 여유 + 5m 안을 동시에 만족)
    dist_tol_m: 0.4          # 데드밴드(±). 벗어나면 전/후진으로 되돌린다(표류를 ~tol 로 제한)

    # ---- 탐색/신선도 ----
    # SEARCH 시간 초과로 DONE 래치할지(계약 전체코스 §2-4). false(기본) = 계속 SEARCH(20000),
    #   다음 WP 진행은 north 의 WP 시간 초과. true 면 옛 동작(search_timeout_sec 뒤 DONE).
    search_timeout_ends: false
    search_timeout_sec: 20.0 # search_timeout_ends: true 일 때만 쓴다
    lost_sec: 2.0            # 부표를 이 시간 넘게 놓치면 SEARCH 로
    # LiDAR 전방 최근접으로 획득(SEARCH→HOLD)할지(§2-5). false(기본) = 비전 색 확인으로만 획득,
    #   LiDAR 최근접은 HOLD 중 직전 비전 방위가 lost_sec 안일 때 보조. true 면 옛 동작.
    lidar_acquire: false
    # HOLD 에서 거리 'unknown'(LiDAR 가 부표를 못 봄)이 이 시간 이어지면 포기 → DONE(20000), ERROR 1회.
    #   거리가 다시 잡히면 리셋. (계약 전체코스 §10-추가 결정 4)
    unknown_giveup_sec: 10.0
    # 한 WP(담당 모드 진입)에서 HOLD 시간 합이 이 값에 닿으면 포기 → DONE(20000), ERROR 1회.
    #   HOLD↔SEARCH 를 오가도 합산, 모드 진입 때만 0. (계약 전체코스 §10-추가 결정 5)
    #   아래 재획득 정지 창(STOP_HOLD) 시간도 합에 든다 — 창 중에도 판정해 넘으면 DONE.
    #   창이 끝나 20000(SEARCH)으로 간 뒤 시간은 안 듦. (결정 6 보충 ①)
    hold_max_sec: 60.0
    # HOLD 에서 놓쳐(lost_sec) SEARCH 로 갈 때 이 시간 동안 20000 대신 STOP_HOLD — 제자리에서 다시 찾음.
    #   그 안에 비전 재획득 → HOLD(합 이어 셈, 창 시간도 hold_max_sec 합에 듦), 못 잡으면 20000
    #   → north 진행. 0 이면 끔(옛 동작).
    #   첫 SEARCH(INIT·모드 진입 뒤)는 해당 없음(20000). (계약 전체코스 §10-추가 결정 6)
    reacquire_stop_sec: 5.0
    angle_stale_sec: 1.0
    scan_stale_sec: 1.0
    lidar_match_half_deg: 3.0   # 부표 방위 ±이 각도의 LiDAR 최소거리
    front_sector_half_deg: 30.0 # HOLD 보조(위 lidar_acquire): LiDAR 전방 ±이 각도 최근접을 부표로

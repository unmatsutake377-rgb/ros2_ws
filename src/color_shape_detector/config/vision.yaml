# 비전 노드 공통 파라미터 (color_shape_detector)
#
# 🚨 카메라를 바꾸는 날 고칠 곳은 여기 hfov_deg 하나다.
#    작년엔 화각이 매직넘버 3개(80.0, 0.09, 0.5)에 흩어져 하드코딩돼 있어서,
#    카메라를 갈면 모든 각도 출력과 상위 튜닝(align_tol_deg, pair_min/max_sep_deg …)이
#    통째로 무효가 되는 구조였다.

/**:
  ros__parameters:
    # 카메라 수평 화각[deg].
    #
    # ✅ **[2026-08-12 실측 정정 — 71.5 는 틀린 값이었다]**
    #    USB3 케이블이 와서 카메라가 처음으로 스트리밍됐고, `camera_info` 의 **공장
    #    캘리브레이션**을 직접 읽었다(640x480, D455 S/N 117122250518, FW 5.17.0.10):
    #        fx = 379.189  fy = 378.751  cx = 319.374  cy = 238.604
    #        → HFOV = 2·atan(320/379.189) = **80.32°**   (VFOV 64.72°)
    #
    #    기존 71.5 는 "0.5m 에서 80px = 9cm" 벤치 역산치였고 **8.82° 틀렸다**(fx 로는 +17.2%).
    #    그 결과 화면 가장자리에서 각도가 **최대 4.4° 어긋나 있었다** —
    #    `align_tol_deg=5°` 의 88%, LiDAR 각분해능(0.225°)의 20배다.
    #    (왜곡까지 포함하면 4.85°. 계산 근거는 docs/결과분석/ 카메라 절)
    #    🚨 아직 물 위 튜닝을 시작하기 **전**이라 지금 고치는 게 맞다. 튜닝 뒤였으면
    #       그 튜닝이 통째로 무효가 됐을 값이다.
    #
    # 🚨 **이 값은 해상도에 딸려 있다.** RealSense 는 해상도마다 센서 크롭이 달라
    #    HFOV 가 바뀐다(640x480=4:3 은 80.32°, 16:9 는 더 넓다).
    #    `rgb_camera.color_profile` 을 바꾸면 **여기도 같이 바꿔야 한다** —
    #    안 바꾸면 에러 없이 각도만 틀어진다.
    #    ⇒ 근본 해법은 `camera_info` 의 fx 를 런타임에 읽는 것이다(미적용, 아래 참고).
    #
    # ⚠️ 핀홀 모델이다. 광각에서는 **가장자리 오차가 커진다**.
    #    광각 카메라를 붙이면 rectified 토픽을 구독하거나 camera_info 의 왜곡계수 D 를
    #    cv2.undistortPoints 로 적용해야 한다. hfov_deg 만 바꾸는 걸로는 부족하다.
    #    실측 D455 왜곡 기여분은 가장자리에서 **0.4°** 로 작다(전체 4.85° 중).
    hfov_deg: 80.32

    # 해상도는 파라미터가 아니다 — **매 프레임 실제 이미지에서 읽는다.**
    #   fx = (width/2)/tan(hfov/2) 라 해상도가 바뀌면 fx 도 바뀌어야 한다.
    #   파라미터로 뒀다면 yaml 을 안 고친 채 해상도만 바꿨을 때 조용히 각도가 틀어진다.
    #   (작년 식이 정확히 그 상태였다: fx 가 444.44px 로 고정 → 640x480 에서만 맞았다)

    # 카메라 이미지 토픽. OAK 전환 시 여기만 바꾼다.
    #   RealSense : /camera/camera/color/image_raw   (현재)
    #   OAK        : depthai_ros_driver 의 컬러 토픽 (도착일에 `ros2 topic list` 로 확인)
    image_topic: "/camera/camera/color/image_raw"

    # 디버그 창. 배는 SSH 로 띄운다 = 헤드리스 → 기본 false.
    debug_view: false

    # ------------------------------------------------------------------
    # HSV 색 범위 — 🚨 **단일 출처는 여기다** (2026-08-12 신설)
    #
    # 예전엔 같은 색이 검출기 3개 파이썬 파일에 **따로, 다른 값으로** 박혀 있었다:
    #   red   gate/turn V≥80  vs dock V≥200   → 어두운 빨강을 도킹만 놓쳤다
    #   green gate/turn H60~85 vs dock H28~40 → **같은 부표를 도킹은 못 봤다**
    #   white turn 색상대 2개  vs dock 색상무관
    # 에러가 안 나고 그냥 못 찾으므로 물 위에서야 알게 되는 종류였다.
    # 이제 여기 한 줄만 고치면 세 검출기에 함께 먹는다. 코드를 안 고쳐도 된다.
    #
    # 형식: 정수 6개가 한 범위 = [lo H,S,V,  hi H,S,V]. 범위 여러 개면 이어붙인다.
    #   H 0~180(OpenCV 는 0~360°를 반으로 접는다) · S,V 0~255
    #   🚨 빨강은 색상환 0을 넘어가므로 **범위 두 개**로 쪼갠다(0쪽 + 180쪽).
    #
    # ⚠️ **아래 값은 전부 잠정이다.** 실내 조명에서 잡은 HSV 는 햇빛 아래서 S·V 가
    #    통째로 달라진다. 실외에서 실제 부표로 재확정할 것:
    #        ros2 run color_shape_detector basic_image_subscriberhsv
    # ------------------------------------------------------------------
    hsv.red: [0, 140, 80, 5, 255, 255,  165, 140, 80, 180, 255, 255]
    hsv.green: [60, 120, 120, 85, 255, 255]
    hsv.white: [0, 0, 220, 180, 40, 255]
    hsv.orange: [3, 130, 100, 20, 255, 255]
    hsv.yellow: [21, 120, 60, 37, 255, 255]
    hsv.blue: [130, 18, 160, 175, 60, 200]

# ------------------------------------------------------------------
# 3-4: 노드별 담당 모드. 검출기는 **상주**하며 /wp_mode 로 자기 차례를 안다.
#   권위 출처는 미션 노드의 active_wp_mode 다 — 바꿀 땐 양쪽을 함께 바꿔라.
#     mode 0,1 → ship_gate  (active_wp_modes=[0,1])
#     mode 2   → ship_back  (active_wp_mode=2)
#     mode 3   → ship_turn  (active_wp_mode=3)
#     mode 7   → ship_dock  (active_wp_mode=7)
#     mode 5,8 → 순수 회피(담당 없음) → 검출기 전부 비활성
#
# 🚨 dock 과 turn 은 둘 다 /image_angle 을 발행한다. 모드가 겹치면 한 토픽에 발행자 2개가
#    되어 **에러 없이** 값이 섞인다. 겹침 없음은 test_mode_gate.py 가 정적으로 검사한다.
# ------------------------------------------------------------------
image_subscriber_gate:
  ros__parameters:
    active_wp_modes: [0, 1]

image_subscriber_turn:
  ros__parameters:
    active_wp_modes: [2, 3]     # 2=white(ship_back 위치유지), 3=red(ship_turn 선회)

image_subscriber_dock:
  ros__parameters:
    active_wp_modes: [7]        # 🚨 작년 매니저는 9 로 띄우고 7 은 비전 OFF 였다
    # ---- D1: 목표 표식 (당일 아침 공지되면 여기만 바꾼다) ----
    #   유효값: color = red/orange/yellow/green/blue/white,  shape = Triangle/Square/Circle
    #   오타면 노드가 부팅 때 ERROR 로그 + 발행 중단(조용히 못 찾는 것 방지).
    target_color: "red"
    target_shape: "Square"
    # ---- D2: N프레임 시간 안정화 (열화 환경에선 confirm_frames·grace 를 올린다) ----
    confirm_frames: 3
    grace_period_s: 2.0
    # ---- D3: 도형 분류·검출 임계 (⚠️ 값은 D4 하네스 수치로 튜닝. 감으로 만지지 말 것) ----
    approx_epsilon: 0.0315
    min_area_px: 80.0
    square_extent_min: 0.4
    square_aspect_lo: 0.6
    square_aspect_hi: 1.4
    circle_circularity_min: 0.82
    square_circularity_max: 0.60
    y_zone_lo: 0.15            # ⚠️ 실측 필요 — 거리별 표식 화면 높이로 확정
    y_zone_hi: 0.55

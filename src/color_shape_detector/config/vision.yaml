# 비전 노드 공통 파라미터 (color_shape_detector)
#
# 🚨 카메라를 바꾸는 날 고칠 곳은 여기 hfov_deg 하나다.
#    작년엔 화각이 매직넘버 3개(80.0, 0.09, 0.5)에 흩어져 하드코딩돼 있어서,
#    카메라를 갈면 모든 각도 출력과 상위 튜닝(align_tol_deg, pair_min/max_sep_deg …)이
#    통째로 무효가 되는 구조였다.

/**:
  ros__parameters:
    # 카메라 수평 화각[deg].
    #   71.5  = 현 RealSense D455 (작년 매직넘버 역산치. 완전 등가값은 71.5077745)
    #   OAK-1 W 는 광각(120~150° DFOV) → 도착일에 **실측해서** 이 값을 바꾼다.
    #
    # ⚠️ 이건 스펙시트 값이 아니라 "0.5m 에서 80px = 9cm" 라는 벤치 캘리브레이션의 역산이다.
    #    T6 벤치에서 격자/자로 1회 재확인할 것.
    #
    # ⚠️ 핀홀 모델이다. 광각에서는 **가장자리 오차가 커진다**.
    #    광각 카메라를 붙이면 rectified 토픽을 구독하거나 camera_info 의 왜곡계수 D 를
    #    cv2.undistortPoints 로 적용해야 한다. hfov_deg 만 바꾸는 걸로는 부족하다.
    hfov_deg: 71.5

    # 해상도는 파라미터가 아니다 — **매 프레임 실제 이미지에서 읽는다.**
    #   fx = (width/2)/tan(hfov/2) 라 해상도가 바뀌면 fx 도 바뀌어야 한다.
    #   파라미터로 뒀다면 yaml 을 안 고친 채 해상도만 바꿨을 때 조용히 각도가 틀어진다.
    #   (작년 식이 정확히 그 상태였다: fx 가 444.44px 로 고정 → 640x480 에서만 맞았다)

    # 디버그 창. 배는 SSH 로 띄운다 = 헤드리스 → 기본 false.
    debug_view: false

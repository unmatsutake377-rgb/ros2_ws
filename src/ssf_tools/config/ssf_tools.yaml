# ssf_tools 파라미터 (blackbox + healthcheck)
# 토픽 이름은 여기서만 바꾼다. 하드코딩 금지 (CLAUDE.md 1-4).

/blackbox:
  ros__parameters:
    rate_hz: 10.0                 # CSV 기록 주기
    log_dir: ""                   # 빈 값이면 ~/ssf_logs 에 저장
    flush_every_n: 10             # N행마다 디스크 flush (1초)
    # ---- 구독 토픽 (전부 관찰 전용) ----
    wp_mode_topic: "/wp_mode"
    gps_topic: "/ublox_gps_node/fix"
    imu_yaw_topic: "/imu/yaw"
    yaw_error_topic: "/yaw_error"
    candidate_topic: "/candidate_angle"
    desired_angle_topic: "/desired_angle"
    motor_topic: "Motor_run"                     # Int32 = pwm_r*10000 + pwm_l
    obstacle_topic: "/obstacle_distance_array"   # Float32MultiArray
    failsafe_topic: "/failsafe_level"            # Int32  (3단계 ship_direction 이 신설 예정)
    gate_count_topic: "/gates_passed"            # Int32  (5단계 ship_gate 가 신설 예정, CLAUDE.md 3-9 확정)
    # ---- 동역학 역산(system ID)용 ----
    imu_topic: "/imu/data"                       # sensor_msgs/Imu (각속도+선가속도) — iahrs 가 발행
    gps_vel_topic: "/ublox_gps_node/fix_velocity"  # TwistWithCovarianceStamped (GPS 속도)
    # ⚠️ system-ID 주행 때는 rate_hz 를 20~50 으로 올려라. 그냥 순항만 하면 추력·관성이 안 잡힌다.

/healthcheck:
  ros__parameters:
    health_period_sec: 2.0        # 검사 주기
    sensor_timeout_sec: 2.0       # 이 시간 이상 안 들어오면 '죽음'
    # T2-7: 카메라는 이미지가 가장 느릴 수 있어 별도 타임아웃(30fps 여도 처리 지연이 붙는다)
    image_timeout_sec: 3.0
    # T8: 발열/전원 감시 임계 (⚠️ i5-12450H 기준 일반 목표 — 벤치에서 조정).
    #    🚨 경고 로그 전용이다. /health_ok 에 안 들어간다(온도로 배를 세우면 진단이 늑대소년).
    enable_thermal: true
    temp_warn_c: 80.0       # 이상이면 경고
    temp_hot_c: 95.0        # 이상이면 강한 경고(강제 스로틀 임박)
    throttle_ratio: 0.6     # 현재클럭/최대 가 이 아래면 스로틀 의심
                            #   (거버너를 performance 로 고정한 상태에서만 의미. boat_boot.sh 참고)
    # ---- 센서 생존 감시 토픽 ----
    scan_topic: "/scan"
    imu_yaw_topic: "/imu/yaw"
    imu_raw_yaw_topic: "/imu/yaw_raw"   # N1: 'IMU 죽음' 과 'yaw_mux 죽음' 을 가른다
    heading_status_topic: "/heading_status"
    gps_topic: "/ublox_gps_node/fix"
    # T2-7: 카메라 침묵 감지. 카메라는 조용히 죽는다 — USB 가 빠져도 에러 토픽은 안 나온다.
    #   V1 에서 depth 가드를 없앴으니 비전 노드는 이미지가 안 와도 예외 없이 그냥 침묵한다
    #   → 여기서 안 잡으면 아무도 모른다.
    #   ⚠️ 카메라를 바꾸면 vision.yaml 의 image_topic 과 **여기를 같이** 바꿔야 한다.
    image_topic: "/camera/camera/color/image_raw"
    # ---- 매핑표 검사 ----
    wp_mode_topic: "/wp_mode"
    candidate_topic: "/candidate_angle"
    # wp_mode -> 담당 노드 매핑표 (실제 waypoint 값: {0,1,2,3,5,7,8})
    #   dock 은 7 이 정답, 코드엔 9 로 박혀있음 = 버그(CLAUDE.md 3-1)
    #   mode 5(WP6,7 회피)·mode 8(WP10 회피)은 담당 노드 없음이 정상 → "none"
    #   (ship_direction 이 GPS 방위로만 감. "none" 은 거짓 경보를 내지 않음, CLAUDE.md 3-6)
    # mode 0,1 → ship_gate (6b: ship_last 제거, mode 0 인수). 5,8 = 회피 구간(담당 없음).
    wp_modes: [0, 1, 2, 3, 5, 7, 8]
    wp_nodes: ["ship_gate", "ship_gate", "ship_back", "ship_turn", "none", "ship_dock", "none"]
    # ---- geofence 배선 검사 ('잊으면 최악') ----
    # north_goal_angle 이 /geofence_state 를 발행하는데 구독자가 0 이면 경계 이탈 방어가
    # 통째로 없는 것이다(실격 위험). 침묵하는 기능은 에러를 안 내니 출발 전에 여기서 잡는다.
    # ⚠️ 6a-2 에서 ship_direction 이 구독하기 전까지는 이 검사가 계속 실패한다 — 의도한 것이다.
    geofence_topic: "/geofence_state"
    require_geofence_subscriber: true

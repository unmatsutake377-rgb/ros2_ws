# ship_turn 파라미터 (하드코딩 금지, CLAUDE.md 1-4)
/ship_turn:
  ros__parameters:
    # 기본 orbit(search_behavior, 2026-11 경기규정 원 선회)에선 켜짐 = mode 3 담당.
    #   hold 옵션이면 launch 가 false 를 넘긴다 — 끄려고 active_wp_mode 를 -1 로 두지 말 것(아래).
    enabled: true
    active_wp_mode: 3        # WP3,4,5 는 모두 /wp_mode==3 — 그중 공지 색 부표 하나를 돈다(한 번, DONE 래치). 끄려고 -1 로 두지 말 것
    period_sec: 0.1

    # ---- orbit 기하 (6c-[4]) ----
    orbit_radius_m: 3.0      # ⚠️ 실측 필요 — 부표를 도는 반경
    radius_tol_m: 0.5        # 반경 허용 오차
    approach_dist_m: 4.0     # ⚠️ 실측 필요 — 이 거리 안으로 들어오면 ORBIT 시작
    k_radial_deg_per_m: 30.0 # 반경 오차 1m 당 조향 보정각
    radial_limit_deg: 45.0   # 반경 보정 최대(접선을 완전히 덮지 않게)
    orbit_target_deg: 420.0  # 한 바퀴 이상(2026-11-15 승인, 계약서_탐색전도리도리 §14-7). 코드 기본값과 같이 고칠 것.
                             #   더 올리면 orbit_max_sec(60, ORBIT 진입부터)도 같이 — 540° 는 시뮬 55 s 로 상한에 붙는다(§12)

    # ---- 시간 ----
    hold_sec: 2.0            # 진입 직후 정지(autonomous 접근)
    search_timeout_sec: 20.0 # 2026-11-11 부터 미사용(SEARCH = 20000, 모드 끝까지) — 선언만 유지
    orbit_max_sec: 60.0      # 안전 타임아웃 (yaw 없어 진행각을 못 잴 때)
    cooldown_sec: 5.0        # 2026-11-11 부터 미사용(완료 → DONE 래치 20000) — 선언만 유지
    lost_sec: 2.0            # 부표를 이 시간 넘게 놓치면 SEARCH(20000) 로 — 다시 잡으면 진행각 0 부터

    # ---- SCAN(도리도리) — 모드 3 첫 진입 INIT 뒤 한 번 (계약서_탐색전도리도리_20261115) ----
    # STOP 50000 → 오른쪽 −scan_angle(SPIN_RIGHT 5000) → HOLD 50000 → 0 → 왼쪽 +scan_angle(SPIN_LEFT 6000) → HOLD
    #   → 0(SPIN_RIGHT) → SEARCH. 공지 색 + 방위 보이면 즉시 APPROACH. 3→3 재실행 없음.
    # 건너뜀(SEARCH + WARN): yaw 없음·stale / /scan 없음·stale / 회전 원(scan_clear_m) 안 반사 / scan_timeout_sec 초과.
    # 🚨 대회 launch 가 이 yaml 을 넘긴다 → 코드 기본값과 같이 고칠 것. 전부 소수점(정수면 rclpy 타입 오류).
    # 🚨 6000(SPIN_LEFT) 경로 실기 미검증 — 좌우 부호 틀리면 한쪽으로만 돌다 timeout 으로 SEARCH(멈추진 않음).
    scan_enabled: true       # false = 옛 동작(INIT → SEARCH)
    scan_angle_deg: 90.0     # ±90° + 카메라 HFOV ±40° ≈ ±130° 시야(§11 시뮬: ±60° 는 배 뒤 부표 놓침). 0 초과 150 이하
    scan_tol_deg: 5.0        # ⚠️ 실측 필요 — 목표각 도달 허용(오버슈트)
    scan_lead_sec: 0.3       # ⚠️ 실측 필요 — |yaw rate|×lead 만큼 일찍 멈춤
    scan_stop_sec: 1.5       # ⚠️ 실측 필요 — 진입 시 정지 대기(관성)
    scan_hold_sec: 1.2       # 끝각 정지 촬영(검출 confirm 여유)
    scan_timeout_sec: 25.0   # SCAN 전체 상한 — 넘으면 SEARCH(무한 선회 금지, [5]① 재발 방지)
    scan_clear_m: 1.0        # ⚠️ 실측 필요 — SCAN 시작 때 신선한 /scan 전 방위에 이보다 가까운 반사가 있으면 건너뜀
                             #   (제자리 회전 원 반길이 ≈0.83 m + 여유. 선체 자기 반사가 잡히면 늘 건너뛴다 — 실기 확인)

    # ---- 신선도 / LiDAR ----
    angle_stale_sec: 1.0
    color_stale_sec: 2.0
    scan_stale_sec: 1.0
    lidar_match_half_deg: 3.0  # 부표 방위 ±이 각도의 LiDAR 최소거리 (부표=점 물체)

    # ---- LiDAR 방위 추적 (카메라 HFOV ±40° 밖 = orbit 자세 ±90° 에서 부표 방위를 LiDAR 로 잇는다) ----
    # 🚨 대회 launch(launch_files.launch.py)가 이 yaml 을 넘긴다(11-05) → yaml 값 = 대회값.
    #    코드 기본값과 같이 고칠 것.
    lidar_track_window_deg: 25.0  # ⚠️ 실측 필요 — 직전 유효 방위 ±이 창 안의 최근접 빔만 부표로 본다
    lidar_track_max_m: 5.0        # ⚠️ 실측 필요 — 이보다 먼 반사는 부표로 안 본다(= orbit_radius 3 + 2).
                                  #   LiDAR 높이·부표 높이 미확인(못 보면 lost_sec 뒤 SEARCH), 수조 6×6 은 벽(3 m) 오인 가능

    # ---- 거리 출처 (계약서_인식융합_20261112 §10 — CLAUDE.md §3 '거리는 LiDAR' 원칙의 승인된 예외) ----
    # 🚨 APPROACH 의 카메라 방위 분기에만 쓴다. ORBIT 의 LiDAR 추적·거리는 그대로(카메라 시야 밖, 계약 위험 4).
    # lidar = /scan 만(옛 동작, /fused_objects 구독도 안 만듦) / fill = LiDAR 먼저, LiDAR 가 못 볼 때(None)만
    #   /fused_objects(perception_fusion) 거리 / fused = /fused_objects 먼저, 맞는 물체 없으면 LiDAR.
    #   잘못된 값 → ERROR 후 lidar. 볼 차례에 /fused_objects 가 없거나 묵으면(fused_stale_sec) LiDAR 거리만 + 5 s 주기 WARN.
    #   기본 = fused(계약서_흰부표_거리융합_v3 G-9, 11-14). 지금 perception_fusion 은 LiDAR+D455 융합뿐(단안·삼각측량 없음,
    #   물 위 실측 0회). perception_fusion 이 꺼졌거나 묵으면 lidar 와 같은 거리. 롤백 = lidar 한 줄(옛 대회값 fill).
    #   코드 기본값과 같이 고칠 것. LiDAR 우선(G-5): fused 라도 depth(D455 단독) 물체는 이 노드 LiDAR 가 못 볼 때만
    #   채운다(LiDAR 값이 있으면 LiDAR). src 4·5(단안·삼각측량 단독)는 fused_allowed_sources 에 넣지 않는다(G-7).
    distance_source: "fused"
    fused_topic: "/fused_objects"
    fused_stale_sec: 0.5     # ⚠️ 실측 필요 — 마지막 정상 수신 뒤 이보다 묵으면 안 쓴다
    fused_match_deg: 5.0     # ⚠️ 실측 필요 — 카메라 방위 ±이 각도 안의 물체만(그중 방위 최근접 하나)
    fused_min_conf: 0.5      # ⚠️ 실측 필요 — 고른 물체의 conf 가 이보다 낮으면 안 씀(다른 물체로 안 넘어감)
    fused_allowed_sources: ["lidar", "fused", "depth"]   # 쓸 물체 출처(row 제외, §10 Q3)

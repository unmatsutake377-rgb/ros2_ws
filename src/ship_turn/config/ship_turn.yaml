# ship_turn 파라미터 (하드코딩 금지, CLAUDE.md 1-4)
/ship_turn:
  ros__parameters:
    # 기본 orbit(search_behavior, 2026-11 경기규정 원 선회)에선 켜짐 = mode 3 담당.
    #   hold 옵션이면 launch 가 false 를 넘긴다 — 끄려고 active_wp_mode 를 -1 로 두지 말 것(아래).
    enabled: true
    active_wp_mode: 3        # WP3,4,5 는 모두 /wp_mode==3 — 그중 공지 색 부표 하나를 돈다(한 번, DONE 래치). 끄려고 -1 로 두지 말 것
    period_sec: 0.1

    # ---- orbit 기하 (6c-[4]) ----
    orbit_radius_m: 3.0      # ⚠️ 실측 필요 — 부표를 도는 반경
    radius_tol_m: 0.5        # 반경 허용 오차
    approach_dist_m: 4.0     # ⚠️ 실측 필요 — 이 거리 안으로 들어오면 ORBIT 시작
    k_radial_deg_per_m: 30.0 # 반경 오차 1m 당 조향 보정각
    radial_limit_deg: 45.0   # 반경 보정 최대(접선을 완전히 덮지 않게)
    orbit_target_deg: 360.0  # 한 바퀴

    # ---- 시간 ----
    hold_sec: 2.0            # 진입 직후 정지(autonomous 접근)
    search_timeout_sec: 20.0 # 2026-11-11 부터 미사용(SEARCH = 20000, 모드 끝까지) — 선언만 유지
    orbit_max_sec: 60.0      # 안전 타임아웃 (yaw 없어 진행각을 못 잴 때)
    cooldown_sec: 5.0        # 2026-11-11 부터 미사용(완료 → DONE 래치 20000) — 선언만 유지
    lost_sec: 2.0            # 부표를 이 시간 넘게 놓치면 SEARCH(20000) 로 — 다시 잡으면 진행각 0 부터

    # ---- 신선도 / LiDAR ----
    angle_stale_sec: 1.0
    color_stale_sec: 2.0
    scan_stale_sec: 1.0
    lidar_match_half_deg: 3.0  # 부표 방위 ±이 각도의 LiDAR 최소거리 (부표=점 물체)

    # ---- LiDAR 방위 추적 (카메라 HFOV ±40° 밖 = orbit 자세 ±90° 에서 부표 방위를 LiDAR 로 잇는다) ----
    # 🚨 대회 launch(launch_files.launch.py)가 이 yaml 을 넘긴다(11-05) → yaml 값 = 대회값.
    #    코드 기본값과 같이 고칠 것.
    lidar_track_window_deg: 25.0  # ⚠️ 실측 필요 — 직전 유효 방위 ±이 창 안의 최근접 빔만 부표로 본다
    lidar_track_max_m: 5.0        # ⚠️ 실측 필요 — 이보다 먼 반사는 부표로 안 본다(= orbit_radius 3 + 2).
                                  #   LiDAR 높이·부표 높이 미확인(못 보면 lost_sec 뒤 SEARCH), 수조 6×6 은 벽(3 m) 오인 가능

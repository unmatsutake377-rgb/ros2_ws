# ═══════════════════════════════════════════════════════════════════════════
#  C94-M8P 이동국(rover) 설정 — A배
#  [2026-09-16] 정리: save 블록 제거(EEPROM 영구 저장 — zed_f9p_rover.yaml 과 같은 이유로
#  런타임(RAM)에만 적용), dynamic_model portable→sea(수상선박, 드라이버 node.cpp 'sea' 지원,
#  u-blox 8 CFG-NAV5 dynModel 5), debug 1→0. uart1 19200·RTCM in 은 C94-M8P 고유라 유지.
#  udev: idProduct 01a8 (u-blox 8) — F9P 의 01a9 와 다르다 → docs/절차/ubuntu_setup.md
#  ⚠️ sea 모델은 A배 실기에서 아직 미확인 — 첫 실기 때 /fix 안정성 확인.
# ═══════════════════════════════════════════════════════════════════════════
ublox_gps_node:
  ros__parameters:
    debug: 0                    # Range 0-4 (0 means no debug statements will print)

    # 🚨 save 블록을 넣지 않는다 (EEPROM 영구 저장 금지 — 잘못 박히면 되돌리기 어렵다)

    device: /dev/ttyGPS
    frame_id: gps
    rate: 1.0                   # in Hz
    nav_rate: 1                 # [# of measurement cycles], recommended 1 Hz, may
                                # be either 5 Hz (Dual constellation) or
                                # 8 Hz (GPS only)
    dynamic_model: sea          # 해상 표면 차량용 (portable 에서 변경 2026-09-16). B배와 동일 근거.
    fix_mode: auto
    enable_ppp: false           # Not supported by C94-M8P
    dr_limit: 0

    # TMODE3 Config
    tmode3: 0                   # Survey-In Mode
    sv_in:
      reset: false              # True: disables and re-enables survey-in (resets)
                                # False: Disables survey-in only if TMODE3 is
                                # disabled
      min_dur: 300              # Survey-In Minimum Duration [s]
      acc_lim: 3.0              # Survey-In Accuracy Limit [m]

    uart1:
      baudrate: 19200           # C94-M8P specific
      in: 32                    # RTCM 3
      out: 0                    # No UART out for rover

    gnss:
      glonass: true             # Supported by C94-M8P
      beidou: false             # Supported by C94-M8P
      qzss: true                # Supported by C94-M8P

    dgnss_mode: 3               # Fixed mode

    inf:
      all: true                 # Whether to display all INF messages in console

    # Enable u-blox message publishers
    publish:
      all: true
      aid:
        hui: false

      nav:
        posecef: false

# motor_control 토너먼트 코스 덮어쓰기 (계약서_토너먼트분리_20261109 T1-1, §9-3)
#
# 무엇: 토너먼트(2척 선착순) 코스에서만 바꿀 값. 공통 motor_control.yaml 위에 덮어쓴다.
# 왜:   선착순이라 결승 앞에서 속도를 줄일 이유가 없다 → 목표(WP) 근접 감속을 끈다.
#       (main 코스는 공통 yaml 의 0.5 그대로 — 이 파일은 main 에 영향 없음)
# 어떻게 붙나: launch 가 course:=tournament 일 때 parameters=[공통 yaml, 이 파일] 순서로
#       넘긴다(T1-4). 뒤 파일이 이긴다. 그래서 **덮어쓰는 키만** 둔다 — 나머지는 공통 yaml 값.
# 현장 조정: 이 파일을 고친 뒤 launch 재시작(`ros2 param set` 무효 — 시작 때만 읽음).
#       현장_조정표 §4 에 기록하고, 배 노트북에서 커밋하지 않는다.
# 🚨 소수점 필수(1.0, 1 아님) — 타입이 코드 기본값(float)과 다르면 노드가 부팅 때 죽는다(T4).
/motor_control:
  ros__parameters:
    # 결승 앞 근접 감속 끔(§9-3). 1.0 = 감속 없음. 결승 정지가 경계를 넘치면 0.5 로 되돌림.
    # 0 금지 — 코드가 0 초과~1 밖이면 0.5 로 되돌린다.
    goal_slow_min_ratio: 1.0

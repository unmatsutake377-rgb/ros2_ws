# motor_control 파라미터 (하드코딩 금지, CLAUDE.md 1-4)
/motor_control:
  ros__parameters:
    # ---- 감속 복구 (시뮬 최적값, CLAUDE.md 3-2) ----
    slow_start_dist: 1.2   # 전방 최근접 장애물이 이보다 가까우면 감속 시작(m)
    min_speed_ratio: 0.7   # 최저 속도비(전진 성분을 중립 쪽으로 당김). dist=0 에서 0.7
    # ---- 조향/추력(배 2척 A/B 다름 → 여기서 뺌, CLAUDE.md 1-4) ----
    base_pwm: 1360          # ⚠️ 실측 필요 — 순항 전진 PWM (1500=중립, <1500 전진)
    max_diff: 100           # ⚠️ 실측 필요 — 조향 최대 좌우 차동
    reverse_pwm: 1590       # ⚠️ 실측 필요 — 후진 PWM (>1500 후진)
    reverse_trim_us: 0      # 후진 좌우 트림(µs). 0 = 끔(지금 출력 그대로). 🚨 정수로(0.0 이면 부팅 사망)
                            # +t → 우측 1590+t / 좌측 1590−t (후진 좌선회 쏠림 보정). |t| ≥ 65 → ERROR + 0
                            # ⚠️ 실측 필요 — 1번배 hold.py 대칭 재현 뒤 그 배 노트북 yaml 에만(커밋 안 함)
                            #    (계약서_후진트림_20261112 §6). 3 s 에 5° 미만 쏠림이면 0 유지
    # SPIN(제자리 선회) 중심 PWM + 차동
    spin_forward_pwm: 1500  # 1500 → 1400/1600 = 순 추력 0 = 진짜 제자리 선회.
                            # 1360 → 1260/1460 = 작년 방식(순항 속도로 원, 반경 2.1m → 도크 충돌).
                            # ⚠️ 물 위서 제자리 선회 안 되면 이 값을 1360 쪽으로 낮춤.
    spin_diff: 100          # SPIN 좌우 차동 크기 (방향은 5000/6000 이 결정)
    steer_invert: false     # ⚠️ 물 위 첫 시험서 확정 — 모터 배선 반대면 true. 조향·SPIN 함께 뒤집음
                            #    (CLAUDE.md §8 "조향 좌/우 부호 = 가장 흔한 사고". 지금 추측 금지)
    # ---- 페일세이프 속도 상한 (/failsafe_level 구독, ship_direction 발행) ----
    # /desired_angle 은 '각도'라 속도를 담을 수 없다 → 속도는 여기서 건다.
    #   레벨0 100% / 레벨1(경고) 70% / 레벨2(정지)는 STOP_HOLD 가 각도로 오므로 분기(1)이 처리.
    #   L1 상한 = 전진·후진 공통(SPIN 은 100%). 근접 감속(slow_start_dist·min_speed_ratio) = 전진만.
    # ⚠️ 경고 감속의 효과는 아직 미측정. 효과 없으면 뺀다(TTC 때처럼). 끄려면 1.0 으로.
    failsafe_l1_speed: 0.7
    # ---- 목표(WP) 근접 감속 (/goal_distance 구독, 계약서_목표근접감속_20261106, A-2) ----
    # north_goal_angle 의 현재 WP 거리. start 에서 시작해 full 에서 하한 — 전진(2,4,6) 중심 PWM 만
    # 1500 쪽으로 당기고 조향 차동은 유지(균일 축소는 선회 반경이 안 줄어든다). SPIN·후진·STOP 제외.
    # 미수신·stale → 1.0(기능 없을 때와 동일). 모드 무관. 끄려면 goal_slow_min_ratio 1.0.
    # ⚠️ 실측 필요 — 가정 계수 기준(1360 속도·정지 거리·선회 지름). 수조 뒤 재조정. 소수점 필수(T4).
    goal_slow_start_m: 8.0      # 이 거리(m)부터 감속 시작
    goal_slow_full_m: 3.0       # 이 거리(m) 이하에서 하한 비율. start 보다 작아야 함
    goal_slow_min_ratio: 0.5    # 중심 비율 하한. base 1360 → 1500−140×0.5 = 1430
                                # 0 금지(1.0 = 끄기) — 0 이면 full_m 안에서 전진 0 → 도착 반경에 못 듦
    goal_dist_stale_sec: 2.0    # /goal_distance 가 이보다 묵으면 감속 해제(north 0.5 s×4, ship_dock 과 동일)
    # ---- 명령 워치독 ----
    cmd_timeout_sec: 0.5   # /desired_angle 이 이보다 끊기면 중립(1500/1500)
                           # 3단계에서 3.5 → 0.5 로 조임. 전제가 성립했다:
                           # ship_direction 제어 루프가 고정주기 타이머라, 살아있는 한 항상 발행한다
                           # (LiDAR 4초 끊겨도 STOP_HOLD 를 40회 계속 발행 — 검증됨).
                           # → /desired_angle 침묵 = ship_direction 사망 (LiDAR 끊김이 아니라).

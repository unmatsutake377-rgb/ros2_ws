# ship_direction 파라미터 (하드코딩 금지, CLAUDE.md 1-4)
/ship_direction:
  ros__parameters:
    # ---- 제어 루프 (스캔 유무와 무관하게 항상 발행) ----
    control_period_sec: 0.1    # 10Hz. 작년엔 scan_cb 안에서만 발행 → LiDAR 끊기면 발행 0회(완전 침묵)
    watchdog_period_sec: 0.1   # 페일세이프 평가(독립 타이머 — scan_cb 에서 평가하면 영원히 평가 안 됨)

    # ---- 페일세이프 임계: 센서가 묵은 시간(초). 3상태·2임계 ----
    # 감시 대상: /scan(LiDAR) 과 /yaw_error(IMU 체인) **둘 다**. 가장 나쁜 센서가 레벨을 정한다.
    #   /scan 만 보면 IMU 사망을 놓친다 — ship_goal_angle 이 /yaw_error 를 끊어줘도(1단계 설계)
    #   들을 귀가 없으면 마지막 yaw_error 로 영원히 조향한다.
    # 센서별로 첫 데이터를 받은 뒤에만 감시(ARMED) — 부팅 오발동 방지.
    # ※ angle_increment 이상 스캔은 하드 폴트 → 확인 N회 없이 즉시 레벨2(정지).
    #   레벨0 정상      : 계산한 각도       / 속도 100%
    #   레벨1 경고(0.7s): 계산한 각도 그대로 / 속도 70%   ← 각도 안 건드림
    #   레벨2 정지(3.0s): STOP_HOLD override / 정지       ← 각도를 덮어쓰는 건 여기뿐
    #   ★ 임계가 적을수록 틀릴 곳이 적다. (중간 'freeze' 레벨은 뺐다 — 새 스캔이 없는데
    #     재계산하면 같은 답이 나오므로 '재계산'과 'freeze'는 같은 동작이다.)
    failsafe_warn_sec: 0.7     # → 레벨1
    failsafe_stop_sec: 3.0     # → 레벨2 (LiDAR 10Hz 기준 30스캔 연속 누락)
    failsafe_confirm_n: 3      # 올릴 땐 연속 N회 확인(지터 방지). 내릴 땐 즉시(자동 복구)

    # ---- 시간 투표 필터 (물보라 한 프레임짜리 오탐 제거) ----
    # 최근 N프레임 중 votes 회 이상 나타난 셀만 진짜 장애물로 인정. 10Hz → 0.3초 기억.
    # 측정(정면 부표 1개, 25판, 물보라 60%): 최소여유 0.17m(없음) → 0.40m(있음). 2.4배.
    # ★ dilate 전, 원본 마스크에 건다 (팽창 후면 진짜 부표의 팽창 영역까지 표가 갈려 얇아진다).
    # 끄려면 frames 나 votes 를 1 로.
    temporal_frames: 3
    temporal_votes: 2

    # ---- 회피 튜닝 (CLAUDE.md §6 시뮬로 검증된 값 — 임의로 바꾸지 말 것) ----
    detection_distance_default: 3.0  # 1.8 이면 8/8 충돌. 3.0 이면 5/8 통과
    detection_distance_gate: 2.0     # 게이트는 좁아서 3.0 이면 오히려 접촉 증가
    gate_wp_modes: [0, 1]            # 게이트 구간 wp_mode (3-6 표: 0=게이트 시작, 1=게이트 끝)
                                     # 작년 코드는 wp_mode==2(위치유지)를 키로 썼다 — 게이트가 아니다
    half_width: 0.45
    clearance: 0.25                  # 스윕: 0.20→접촉1.7 / 0.25→0.2 / 0.30→0.8 / 0.45→807초 폭주
    border_margin: 2
    max_spike_ratio: 0.01
    min_obstacle_cells: 1            # 3 이면 작은 부표가 무시된다
    reverse_cooldown_sec: 3.0
    # ※ rear_obstacle_ignore_margin 은 '튜닝값'이 아니라 증명된 결함이라 구조 커밋에서 제거했다
    #    (물보라 0.3m 반사 하나가 실제 1.6m 부표를 통째로 지웠다: 17셀 → 0셀).

# ship_direction 파라미터 (하드코딩 금지, CLAUDE.md 1-4)
/ship_direction:
  ros__parameters:
    # ---- 제어 루프 (스캔 유무와 무관하게 항상 발행) ----
    control_period_sec: 0.1    # 10Hz. 작년엔 scan_cb 안에서만 발행 → LiDAR 끊기면 발행 0회(완전 침묵)
    watchdog_period_sec: 0.1   # 페일세이프 평가(독립 타이머 — scan_cb 에서 평가하면 영원히 평가 안 됨)

    # ---- 페일세이프 임계: 센서가 묵은 시간(초). 3상태·2임계 ----
    # 감시 대상: /scan(LiDAR) 과 /yaw_error(IMU 체인) **둘 다**. 가장 나쁜 센서가 레벨을 정한다.
    #   /scan 만 보면 IMU 사망을 놓친다 — ship_goal_angle 이 /yaw_error 를 끊어줘도(1단계 설계)
    #   들을 귀가 없으면 마지막 yaw_error 로 영원히 조향한다.
    # 센서별로 첫 데이터를 받은 뒤에만 감시(ARMED) — 부팅 오발동 방지.
    #   → 부팅부터 /yaw_error 가 한 번도 안 오면(GPS fix 없음 등) 레벨 0 그대로다. 이때 candidate 20000
    #     (갭 선택)이면 코드가 50000 정지 + 5 s 주기 ERROR 로 막는다 [N] (계약서_yaw미수신정지_20261105).
    #     파라미터·끄는 스위치 없음. 각도·5000·6000·180 은 그대로 따른다.
    # ※ angle_increment 이상 스캔은 하드 폴트 → 확인 N회 없이 즉시 레벨2(정지).
    #   레벨0 정상      : 계산한 각도       / 속도 100%
    #   레벨1 경고(0.7s): 계산한 각도 그대로 / 속도 70%   ← 각도 안 건드림
    #   레벨2 정지(3.0s): STOP_HOLD override / 정지       ← 레벨 중 각도를 덮어쓰는 건 여기뿐
    #   ★ 임계가 적을수록 틀릴 곳이 적다. (중간 'freeze' 레벨은 뺐다 — 새 스캔이 없는데
    #     재계산하면 같은 답이 나오므로 '재계산'과 'freeze'는 같은 동작이다.)
    failsafe_warn_sec: 0.7     # → 레벨1
    failsafe_stop_sec: 3.0     # → 레벨2 (LiDAR 10Hz 기준 30스캔 연속 누락)
    failsafe_confirm_n: 3      # 올릴 땐 연속 N회 확인(지터 방지). 내릴 땐 즉시(자동 복구)

    # ---- Geofence (경계 이탈 = 실격). 6a-2 ----
    # north 가 경계를 '가짜 LiDAR'로 쏴서 보낸다 → 여기선 스캔과 min() 병합만 한다.
    # /geofence_state = [angle_min_deg, angle_inc_deg, r0, r1, ...] (상대방위, 멀면 inf).
    #   상대방위는 **좌 양수** — LiDAR a−80·/candidate_angle 과 같은 부호. 인덱스 0(−80)=우현, 끝(+80)=좌현.
    #   (계약서_geofence부호_20261104. 여기서는 부호 변환 없음 — north 가 이 규약으로 낸다.)
    #   ranges[i] = min(real_ranges[i], geofence_ranges[i])
    # 그 뒤는 기존 파이프라인(마스크→dilate→갭팔로잉)이 알아서 한다.
    # ★ 튜닝 파라미터가 없다. 원뿔 방식(half_block)은 모서리에서 정면이 '틈'으로 열려 폐기했다.
    geofence_stale_sec: 2.0       # 🚨 묵으면 병합하지 않는다 (north 주기 0.5s 의 4배).
                                  #    묵은 '없는 벽'은 배를 가둔다. 모르면 입을 다문다.
    # 하드 가드 [I]: (A)SPIN·(B)candidate 구간(도킹)은 마스크 병합이 없어 경계로 파고든다.
    #   경계가 아래 거리 안이고 전진 방향 ±cone 과 겹치면 미션 무시하고 정지. 실격 방지 우선.
    geofence_stop_margin_m: 2.0   # 이 거리 안이면 하드 정지 판정 대상
    geofence_stop_cone_deg: 60.0  # 경계 방위가 전진 방향 ±이 각도 안이면 정지

    # ---- 감속 신호용 공간 median 필터 — 기본 ON ----
    # _closest_obstacle(감속 신호)에만 적용. 회피 마스크(_compute)는 안 건드린다.
    # 작년엔 raw min 이라 물보라 반사 한 점(0.3m)이 그대로 motor_control 감속을 물렸다.
    # 측정(시드 20, 물보라 30%): raw-min 가짜감속 36.8% → median 8.9%(기준선). 접촉은 전 조건 0.
    # ★ 시간 투표(아래)는 효과 0 이라 OFF, 이건 명확한 이득이라 ON. (시간 vs 공간, 다른 필터다)
    # ⚠️ 시뮬 물보라는 '단일점' 모델. 실제 물보라가 작은 군집이면 커널5로 부족할 수 있다
    #    → 배 뜬 뒤 블랙박스 obstacle_min_dist 로 실측 확인 후 7/9 로 올릴 것.
    obst_median_kernel: 5        # 0 이면 raw-min 폴백

    # ---- 시간 투표 필터 — 기본 OFF (frames=1). 코드는 남겨둠 ----
    # 최근 N프레임 중 votes 회 이상 나타난 셀만 장애물로 인정하는 필터.
    # ⚠️ 시드 20개로 재보니 효과 없음: OFF→접촉 19/20·전진 25.5m / ON→접촉 20/20·전진 23.4m.
    #    해당 시나리오(정면 부표+물보라 60%)는 어느 코드든 95% 접촉하는 '통과 불가' 판이었다.
    #    처음 효과가 있어 보인 건 단일 시드의 운.
    # → 무해하지만 무익 → 기본 OFF. (TTC 는 '해로워서' 삭제, 이건 '무익해서' OFF)
    #    실제 물보라의 시간 특성이 시뮬과 다를 수 있으니 켤 수 있게 남긴다.
    # 켜려면: temporal_frames: 3, temporal_votes: 2
    temporal_frames: 1
    temporal_votes: 2

    # ---- 회피 튜닝 (CLAUDE.md §6 시뮬로 검증된 값 — 임의로 바꾸지 말 것) ----
    detection_distance_default: 3.0  # 1.8 이면 8/8 충돌. 3.0 이면 5/8 통과
    detection_distance_gate: 2.0     # 게이트는 좁아서 3.0 이면 오히려 접촉 증가
    gate_wp_modes: [0, 1]            # 게이트 구간 wp_mode (3-6 표: 0=게이트 시작, 1=게이트 끝)
                                     # 작년 코드는 wp_mode==2(위치유지)를 키로 썼다 — 게이트가 아니다
    half_width: 0.29                 # ✅ 1번배 **줄자 실측 0.57m**(2026-09-28, 스러스터·러더 포함 좌우 최대) ÷ 2 = 0.285
                                     #    → 0.29 로 **올려서** 쓴다: ① 5mm 보수 쪽 ② 스윕 격자의 실측 지점(폭 0.58)과 같아
                                     #      아래 clearance 근거를 보간 없이 그대로 쓸 수 있다.
                                     # ✅ 2번배 줄자 실측(2026-10-24): 길이 1.77 · 폭 0.535 · 깊이 0.14m → half 0.2675 < 0.29 라 공용 0.29 그대로.
                                     #    시뮬(제어 0.29 / 물리 0.2675, 시드 20·80런): 접촉 0.95 · 정체 0. ⚠️ 0.535 가 스러스터 포함인지 확인 전
                                     # 같이 잰 것: 길이 1.66m · 깊이 0.38m(선체 17 + 스러스터 11 + 러더 10)
                                     # 폭이 바뀌면 → 09-28 스윕(시드 20) 폭별 최적 clearance 에서 고른다:
                                     #   0.43m→0.35 / 0.50m→0.30 / 0.58m→0.25 / 0.64m→0.25 / 0.70m→0.20  (tools/sim/sweep_s1.py)
                                     # 🚨 바꾸면 **네 곳을 같이**: 이 yaml · 노드 declare_parameter 기본값 · test fake · tools/sim/ssf_sim.py
                                     # 0.45(작년 배 0.9m)는 갭을 1.15m 요구 → 좁은 게이트 후진 반복·접촉 3회. S1 참조
    clearance: 0.25                  # 09-28 재스윕(half_width 0.29, 시드 20·80런 평균): 0.20→접촉1.95 / 0.25→1.32 / 0.30→1.46(정체2%) / 0.35→정체28% / 0.45→정체50%
                                     # (구 스윕은 half_width 0.45 기준: 0.20→1.7 / 0.25→0.2 / 0.30→0.8 / 0.45→807초 폭주)
    border_margin: 2
    max_spike_ratio: 0.01
    min_obstacle_cells: 1            # 3 이면 작은 부표가 무시된다
    # ---- [L] 후진 후 재탐색 상태기계 (경로 없을 때) ----
    reverse_duration_sec: 0.5        # 한 번 후진하는 시간
    reverse_cooldown_sec: 3.0        # 후진 후 STOP 재탐색 시간. 뒤 못 보므로 '계속 후진' 대신 멈춰 재탐색
    # ---- (B) candidate 후진(180.0) 신선도 (계약서_후진통과_20261104 §10-4) ----
    # /candidate_angle 180.0(ship_dock BACKOFF·ship_back reverse) → 260(후진). 단, 수신 후 이 시간 넘게
    # 갱신이 없으면 발행 노드 사망으로 보고 STOP_HOLD(묵은 180 으로 무한 후진 방지). 다른 값엔 안 건다.
    # 발행 노드 10 Hz 매 틱 발행 → 0.5 s = 5 틱 누락. 비유한·≤0 이면 노드가 0.5 로 되돌린다.
    # 🚨 대회 launch 가 이 yaml 을 넘긴다(11-05) → yaml 값이 대회값. 코드 기본값도 같게 바꿀 것.
    candidate_reverse_stale_sec: 0.5
    # ---- candidate 전체 신선도 (계약서_전체코스_20261104 §2-6·§10-3) ----
    # /candidate_angle 이 수신 후 이 시간 넘게 갱신이 없으면 발행 노드 사망으로 보고 20000(GPS 주행 +
    # LiDAR 회피)으로 바꾼다. 진입 ERROR 1회 + 5 s 주기 ERROR, 복구 INFO 1회. wp_mode 가 바뀌면
    # candidate 를 20000·수신 기록 없음으로 초기화. 발행 주기 0.1 s(미션 노드)·0.5 s(north) → 1.0 =
    # north 주기 × 2. 180(후진)은 위 0.5 s 유지: 0.5~1.0 s STOP_HOLD, 1.0 s 넘으면 20000.
    # 비유한·≤0 이면 노드가 1.0 으로 되돌린다.
    # 🚨 대회 launch 가 이 yaml 을 넘긴다(11-05) → yaml 값이 대회값. 코드 기본값도 같게 바꿀 것.
    candidate_stale_sec: 1.0
    # ---- [K] 조향각 변화율 제한 (0~160° 정상 조향값에만 적용) ----
    rate_limit_max_deg_per_tick: 15.0  # tick당 최대 변화폭. 실각속도=이 값/control_period(0.1s→150°/s). 실측 후 튜닝
    # ---- (C) 후보 정렬 벌점(도) — 발견 8 (계약서_회피편선택_20261106). 끄려면 0.0 ----
    side_hysteresis_deg: 40.0   # 직전 선택과 정면(80) 반대편 후보에 벌점 (편 바꿈 방지)
    cross_penalty_deg: 90.0     # 정면과 후보 사이에 장애물 덩어리 중심이 끼면 벌점 (앞 가로지름 방지)
    # ---- (C) 후보 0 개 + 옆 장애물 → 후진 대신 비킴(도) — 발견 9 (계약서_옆비킴_현장조정_20261106) ----
    # 가장 가까운 장애물 중심이 정면에서 15~60° 옆이고 정면 ±10°·정면→비킬 각 호 전체 > 0.8 m,
    # 비킬 각 ±15° > 1.0 m 이면 장애물 반대편으로 이 각도만큼 꺾는다(260 대신). 15°·60°·0.8·1.0 은 상수.
    # 정횡 60° 넘으면(선미 휘두름) 후진 유지. 게이트 구간(gate_wp_modes 0·1)은 비킴 안 함(기존 후진).
    # 0.0 = 끔(기본, 기존 후진과 같음). 실배 확인(steer_invert 부호·선미–부표 여유) 뒤 배별 yaml 에서 60.0.
    # 최대 80(목표각 0~160 안). 비유한·음수·80 초과 → 노드가 0.0(끔)으로 되돌리고 WARN. 소수점 필수.
    side_escape_deg: 0.0
    # ---- (C) DWA — 3자유도 굴림 + 직사각형 선체 vs LiDAR (발견 10·11, 계약서_DWA_20261106) ----
    # wp_mode 가 dwa_modes 이고 (C)(20000) 이면 조향각 0~160(5° 간격)을 각각 2.5 s 굴려 선체가 LiDAR 점에
    # 0.25 m 안으로 안 드는 각 중 목표에 가까운 것을 낸다. 전부 불가면 기존 결과(갭·비킴·후진).
    # 끔(기본) = 기존과 같다. 실배 확인(선회 반경·비키는 방향·물보라 폴백) 뒤 배별 yaml 에서 dwa_enabled true.
    # 🚨 motor_control 의 base_pwm·max_diff·reverse_pwm 을 1360/100/1590 에서 바꾼 배는 DWA 끔
    #    (모델이 그 값을 사본으로 갖고 있어 어긋나도 경고 없음).
    # 경계 폴리곤(geofence_polygon)이 없으면 DWA 가 경계를 못 본다 → 우회 폭 실배 확인.
    dwa_enabled: false
    dwa_modes: [8]              # 5·8 만 허용. 처음 [8] → 확인 뒤 [5, 8]. 0·1·2·3·7 은 노드가 빼고 WARN
                                # (다 빠지면 DWA 끔). 빈 리스트 [] 금지(원소 타입 미정, T4)
    dwa_hull: 'A'               # 🚨 배마다 다름 — 1번배 'A' / 2번배 'B'. 그 밖 → ERROR + DWA 끔.
                                #    노트북 yaml 손편집(결정 9), 시작 INFO 에 선체 글자가 찍힌다
    dwa_model_agility: 1.0      # ⚠️ 실측 필요 — 모델 예민도 배율(감쇠 ÷a, 추력 ×a). 0.5~2.0 밖 → 1.0.
                                #    실배 속도·선회가 모델보다 둔하면 줄이고 예민하면 키운다. 모르면 큰 쪽(발견 11)
    dwa_lidar_x_m: 0.0          # ⚠️ 실측 필요 — LiDAR 가 선체 중심보다 앞(+)/뒤(−)로 떨어진 거리(m).
                                #    |x| > 1.0·비유한 → 0.0. 소수점 필수(T4)
    # ※ rear_obstacle_ignore_margin 은 '튜닝값'이 아니라 증명된 결함이라 구조 커밋에서 제거했다
    #    (물보라 0.3m 반사 하나가 실제 1.6m 부표를 통째로 지웠다: 17셀 → 0셀).

# ═══════════════════════════════════════════════════════════════════════════
#  토너먼트 웨이포인트(GPS 좌표) — course:=tournament 기본 파일
#  (계약서_토너먼트분리_20261109 T1-3, §9-8)
# ═══════════════════════════════════════════════════════════════════════════
#
#  ▶ 이 파일은 **템플릿**입니다. 좌표는 자리표시값(종합임무 시작점 근처)입니다.
#     ⚠️ 현장 레인별 녹화본으로 교체(waypoints_file:=) — 이 파일을 고치지 말고
#        노트북 녹화본 경로를 launch 인자로 줍니다:
#          ros2 launch launch_files launch_files.launch.py boat:=A course:=tournament \
#              waypoints_file:=<레인별 녹화본.yaml>
#  ▶ 🚨 모든 줄이 mode 8 이어야 합니다. 하나라도 다른 mode 면 노드가 출발하지 않습니다
#     (종합임무 파일을 잘못 물린 경우를 잡는다 — waypoint_loader.validate_course).
#  ▶ 마지막 WP 를 지나면 /candidate_angle 50000(STOP_HOLD) → 즉시 정지.
#     그래서 마지막 점은 **결승선 너머 약 3 m** 에 찍습니다(도착 반경 2.5 m 안에 들면 dwell 0.5 s 후 정지).
#     정지 지점이 경기장 경계(geofence) 안인지 확인하세요(north_goal_angle_tournament.yaml).
#
#  ▶ 형식:  - {구역: "설명", lat: 위도, lon: 경도, mode: 8, dwell: 머무는초}
# ═══════════════════════════════════════════════════════════════════════════

waypoints:
  - {구역: "T0 출발 근처",      lat: 35.1862375,   lon: 128.5655118,    mode: 8, dwell: 0.5}  # ⚠️ 현장 레인별 녹화본으로 교체(waypoints_file:=)
  - {구역: "T1 결승선 너머 3m", lat: 35.1864375,   lon: 128.5655118,    mode: 8, dwell: 0.5}  # ⚠️ 현장 레인별 녹화본으로 교체(waypoints_file:=)

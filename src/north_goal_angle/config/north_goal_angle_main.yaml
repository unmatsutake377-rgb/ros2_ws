# north_goal_angle 코스별 덮어쓰기 — course:=main (종합임무)
# launch 가 공통 north_goal_angle.yaml **뒤에** 얹는다(뒤 파일이 이긴다). 계약서_토너먼트분리_20261109 T1-3.
# 여기 적는 키는 공통 yaml 과 같은 이름·타입이어야 한다(test_course_files.py 가 검사).
# 지금은 공통과 같은 값 — main 동작 불변.
/north_goal_angle:
  ros__parameters:
    # 경기장 폴리곤 [lat1, lon1, lat2, lon2, ...]. ⚠️ 실측 필요 — 비어 있으면 geofence 꺼짐(공통 yaml 과 같음).
    geofence_polygon: []
    # 장애물 구간 폴리곤 [lat1, lon1, ...] — 회피 WP(mode 5, 구역 안)에서만 두 번째 벽으로 켠다.
    #   ⚠️ 실측 필요 — 비어 있으면 꺼짐. 회피 WP 는 이 경계에서 3 m 이상 안쪽에 찍는다.
    geofence_avoid_polygon: []

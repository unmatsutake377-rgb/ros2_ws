# ═══════════════════════════════════════════════════════════════════════════
#  대회 웨이포인트(GPS 좌표) — 대회장에서 여기만 고칩니다
# ═══════════════════════════════════════════════════════════════════════════
#
#  ▶ 무엇을 바꾸나:  각 구역의 lat(위도) · lon(경도) 만 대회장 실측값으로 바꿉니다.
#  ▶ 절대 바꾸지 마세요:  mode(미션번호) 와 순서.  이게 미션 진행 순서입니다.
#                        (좌표만 바꾸고 mode·dwell·순서는 그대로 두세요)
#  ▶ 예외 — 도킹 네 줄('도킹 접근 10m' ~ 'WP9 도킹 이탈', ⚠️ 현장 교체 표시):
#     지금 값은 자리표시값(WP8 = 칸 입구 중심(도크 정면 선 위), 도크 정면이 339.6°(북북서)를
#     본다고 가정)입니다.
#     대회장에서 목표 칸이 공지되면 tools/dock_wp.py 가 찍어 주는 네 줄로 통째로 바꿉니다.
#     (절차: docs/절차/도킹_칸별_웨이포인트.md — 손으로 좌표만 고치지 마세요)
#  ▶ 순서 = 2026 규정 종합임무 채점 구간(경기규정 (5)):
#     항로추종(게이트) → 위치유지 1 → 도킹 → 탐색 → 위치유지 2(장애물 구간 앞) → 장애물 회피 → 종료 게이트.
#     (11-12 전까지는 게이트 → 위치유지 → 탐색 → 회피 → 도킹 → WP10 이었다 — 규정과 달라 바꿨다.)
#  ▶ 번호 주의:  구역 이름의 WP 번호는 **역할 이름**이고 순서가 아닙니다(도킹 WP8·WP9 가 탐색 WP3 보다 앞).
#     로그의 'WP번호'(0부터 센 순번): WP2 위치유지 1 = 2, 도킹 접근 10m = 3, 6m = 4, WP8 입구 = 5,
#     WP9 이탈 = 6, 탐색 접근 = 7, 탐색 WP3·4·5 = 8·9·10, 위치유지 2 접근 = 11, 위치유지 2 = 12,
#     WP6 회피 시작 = 13, WP7 회피 끝 = 14, WP10 = 15.
#  ▶ '탐색 접근'·'위치유지 2 접근'(mode 5) 은 그 구역 바로 앞, 다른 색 부표·도크 표식이 화면에 덜 들어오는 곳에 찍습니다.
#     위치유지 2 접근은 부표에서 너무 가깝지 않게(시뮬: 6 m 는 짧아 ship_back 이 잡기 전에 도착·dwell 로 넘어갔다, 10 m 는 통과).
#     없으면 이동 내내 검출이 켜져 지나가는 게이트 부표·도크 표식을 목표로 잡는다(11-12 시뮬: 탐색 0/20, 첫 탐색 WP 시간 초과 20/20).
#  ▶ 장애물 구간 경계(geofence_avoid_polygon)를 쓰면 WP6·WP7 은 그 경계에서 3 m 이상 안쪽,
#     위치유지 2·WP10 은 구역 밖(경계가 켜지지 않는 점)에 찍습니다.
#
#  ▶ 형식:  - {구역: "설명", lat: 위도, lon: 경도, mode: 미션번호, dwell: 머무는초}
#
#  ▶ mode(미션번호) 뜻:  0·1 게이트 / 2 위치유지 / 3 부표돌기 / 5·8 회피 / 7 도킹
#
#  ▶ 저장 후:  배를 다시 실행하면 이 좌표로 움직입니다.
#     ⚠️ 위도·경도를 바꿔 넣거나(예: lat 자리에 경도), 오타를 내거나, 콤마·중괄호를
#        빠뜨리면 → 배가 출발하지 않고 화면에 "몇 번째 줄이 왜 틀렸는지" 알려줍니다.
#        (틀린 좌표로 달리느니 멈추는 게 안전합니다.)
# ═══════════════════════════════════════════════════════════════════════════

waypoints:
  - {구역: "WP0 게이트 시작",   lat: 35.1862375,     lon: 128.5655118,    mode: 0, dwell: 3.0}
  - {구역: "WP1 게이트 끝",     lat: 35.1863642,     lon: 128.5657123,    mode: 1, dwell: 3.0}
  - {구역: "WP2 위치유지 1",    lat: 35.1868822,     lon: 128.5660465,    mode: 2, dwell: 0.5}
  # ↓ 도킹 네 줄 — 자리표시값: dock_wp.py --bay 35.1859269 128.5655428 --out-deg 339.635
  - {구역: "도킹 접근 10m",     lat: 35.1860112,   lon: 128.5655045,    mode: 5, dwell: 1.0}  # ⚠️ 현장 교체
  - {구역: "도킹 접근 6m",      lat: 35.1859775,   lon: 128.5655198,    mode: 5, dwell: 1.0}  # ⚠️ 현장 교체
  - {구역: "WP8 도킹 입구",     lat: 35.1859269,   lon: 128.5655428,    mode: 7, dwell: 1.0}  # ⚠️ 현장 교체
  - {구역: "WP9 도킹 이탈",     lat: 35.1859775,   lon: 128.5655198,    mode: 7, dwell: 1.0}  # ⚠️ 현장 교체
  - {구역: "탐색 접근",         lat: 35.1867941,   lon: 128.5657976,    mode: 5, dwell: 1.0}  # 탐색 구역 앞 — 자리표시: WP3 앞 8 m
  - {구역: "WP3 부표(초록)",    lat: 35.1868638,     lon: 128.56582129999, mode: 3, dwell: 0.5}
  - {구역: "WP4 부표(빨강)",    lat: 35.1867763,     lon: 128.5658085,    mode: 3, dwell: 0.5}
  - {구역: "WP5 부표(하양)",    lat: 35.1868645,     lon: 128.5656684,    mode: 3, dwell: 0.5}
  - {구역: "위치유지 2 접근",   lat: 35.1868049,   lon: 128.5656449,    mode: 5, dwell: 1.0}  # 자리표시: 위치유지 2 앞 10 m
  - {구역: "WP5b 위치유지 2(장애물 구간 앞)", lat: 35.1867189, lon: 128.5656109, mode: 2, dwell: 0.5}  # 자리표시: WP6 앞 8 m
  - {구역: "WP6 회피 시작",     lat: 35.1866601,     lon: 128.5655597,    mode: 5, dwell: 1.0}
  - {구역: "WP7 회피 끝",       lat: 35.186396099999, lon: 128.5653297,   mode: 5, dwell: 1.0}
  - {구역: "WP10 종료 게이트 너머", lat: 35.1863520,  lon: 128.5652913,    mode: 8, dwell: 3.0}  # 자리표시: WP7 뒤 6 m

# north_goal_angle 코스별 덮어쓰기 — course:=tournament (토너먼트)
# launch 가 공통 north_goal_angle.yaml **뒤에** 얹는다(뒤 파일이 이긴다). 계약서_토너먼트분리_20261109 T1-3.
# 여기 적는 키는 공통 yaml 과 같은 이름·타입이어야 한다(test_course_files.py 가 검사).
# 바꾸는 법: 노트북에서 이 파일 수정 → launch 재시작(param set 무효). 현장_조정표 §4 에 기록.
/north_goal_angle:
  ros__parameters:
    # 경기장 폴리곤 [lat1, lon1, lat2, lon2, ...] 평탄 배열, 최소 3점(=6개 수).
    # 현장 2경기장 좌표, 결승선 너머까지 포함(하드 정지 2 m).
    #    (결승 뒤 정지 지점이 경계 2 m 안이면 ship_direction 하드 정지가 먼저 걸린다.)
    #    비어 있으면 geofence 꺼짐 + 시작 WARN. 시작 로그 'geofence ON(n점)' 확인.
    # 11-14: 1번배 노트북에서 찍은 4점(약 38 m × 9~11 m 레인)을 두 배 공유로 커밋 — 사용자 결정.
    #    공유 레인 1(tools/tournament_lanes/waypoints_tournament_1.yaml) T0·T1 은 끝 변까지 각 2.5 m 안쪽.
    #    레인이 바뀌면 이 4점도 그 레인 경계로 바꿔야 한다(다른 레인을 이 경계로 달리면 바로 경계 정지).
    # 11-14 10:4x: 긴 변 두 개(북서·남동)를 각각 바깥으로 2.5 m 넓힘 — 사용자 결정(두 배 공통).
    #    새 출발·도착점(2번배 전달: 35.1848206,128.5653762 → 35.1846217,128.5652193, 방위 213°)이
    #    레인(234°)을 비스듬히 가로질러 옛 경계에서 옆 변까지 0.9 m·0.5 m(하드 정지 2 m 안)였다.
    #    넓힌 뒤: 새 T0 옆 변 3.4 m·북동 끝 1.2 m(뒤쪽이라 출발 방향 원뿔 밖), 새 T1 옆 변 3.0 m. 끝 변은 그대로.
    #    옛 4점: [35.1847663, 128.5654408, 35.1848336, 128.5653811, 35.1846268, 128.5650473, 35.1845467, 128.5651185]
    geofence_polygon: [35.1847489, 128.5654583, 35.1848517, 128.5653646, 35.1846449, 128.5650308, 35.1845293, 128.565136]

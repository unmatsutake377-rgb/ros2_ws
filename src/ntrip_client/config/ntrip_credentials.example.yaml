# ═══════════════════════════════════════════════════════════════════════════
#  NTRIP 계정 설정 — 템플릿 (이 파일은 저장소에 올라갑니다. 여기에 실제 값을 쓰지 마세요)
# ═══════════════════════════════════════════════════════════════════════════
#
#  ▶ 쓰는 법
#      1) 이 파일을 노트북 로컬로 복사합니다:
#           mkdir -p ~/.ssf
#           cp ntrip_credentials.example.yaml ~/.ssf/ntrip_credentials.yaml
#      2) ~/.ssf/ntrip_credentials.yaml 을 열어 실제 값으로 채웁니다.
#      3) 끝. launch 가 알아서 읽습니다.
#
#  ▶ 왜 저장소 밖(~/.ssf/)인가
#      계정 정보가 GitHub 에 올라가면 안 됩니다(docs/절차/ubuntu_setup.md 9단계).
#      🚨 실제로 예전에 작년 계정이 launch 파일에 평문으로 커밋돼 있었습니다.
#         "받아놓을 그릇" 이 없으면 사람은 있는 자리(=launch 파일)에 넣게 됩니다.
#         그래서 저장소 밖에 두어 **물리적으로 커밋이 불가능**하게 만듭니다.
#
#  ▶ 경로를 바꾸고 싶으면
#      환경변수:  export SSF_NTRIP_CREDENTIALS=/원하는/경로.yaml
#      launch 인자: ros2 launch ntrip_client ntrip_client_launch.py \
#                     credentials_file:=/원하는/경로.yaml
#
#  ▶ 이 파일이 없으면
#      ntrip_client 노드를 **띄우지 않고** 에러 로그만 남깁니다.
#      나머지 시스템(LiDAR·IMU·GPS·제어)은 그대로 돕니다 — RTK 보정만 없는 상태가 됩니다.
#      (⚠️ 예외를 던지면 launch 전체가 죽습니다. 2026-08-06 에 실제로 그렇게 당했습니다.)
# ═══════════════════════════════════════════════════════════════════════════

ntrip:
  # ── 캐스터 주소 ──────────────────────────────────────────────────────────
  # 발급받은 기관이 알려줍니다. 작년엔 gnssdata.or.kr:2101 이었지만
  # ⚠️ 새로 발급받는 곳이 어디인지 확인하고 채우세요. 추측해서 넣지 마세요.
  host: ""                    # 예: gnssdata.or.kr
  port: 2101                  # 대개 2101

  # 마운트포인트 = 어느 기준국의 보정을 받을지. 대회장에서 가까운 곳을 고릅니다.
  # 캐스터 접속 후 목록에서 확인할 수 있습니다.
  mountpoint: ""              # 예: DAEG-RTCM31

  # ── 인증 ────────────────────────────────────────────────────────────────
  authenticate: true          # 대부분 true. 무인증 캐스터면 false
  username: ""
  password: ""

  # ── 프로토콜 ────────────────────────────────────────────────────────────
  # 캐스터가 특정 NTRIP 버전을 요구하면 "1.0" 또는 "2.0". 모르면 비워둡니다.
  # (2026-08-06 실기: 작년 설정으로 접속하니 404 와 함께
  #  "NTRIP version was not specified" 경고가 같이 나왔습니다. 접속 실패하면 여기부터 의심)
  ntrip_version: ""

  # ── SSL (대개 안 씁니다) ────────────────────────────────────────────────
  ssl: false
  cert: ""
  key: ""
  ca_cert: ""

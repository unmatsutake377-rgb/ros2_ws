# ship_avoid 파라미터 — 코드 기본값(core.AvoidParams·노드)과 같게 유지 (CLAUDE.md §1-4).
# 🚨 소수점 값은 반드시 소수점으로(정수로 쓰면 타입 불일치로 노드가 죽을 수 있다).
# ⚠️ 실측 필요: low_r, buoy_r, obstacle_r, default_half_width_m, cam_h, cam_pitch_deg, cam_roll_deg, cam_h_sigma_m,
#   pixel_sigma, obstacle_match_deg, cam_yaw_offset_deg, dori_lead_s, stop_lead_s, pitch_sign, roll_sign, imu_stale_sec, turn_gain_per_s
#   (cam_h 0.415·cam_pitch_deg 11.0 = 마스트 설계값(mast v2, 11-14 사용자 결정 — 두 배 공통), 실측 아님)
/ship_avoid:
  ros__parameters:
    # 회피 방식 스위치 (계약서_도리도리회피_launch_20261113 C1, v2_20261114 U1 + 사용자 결정 11-14).
    #   'fused' = 도리도리 코어(명세 1~8, 기본) — /avoid_zone 이 신선하고 true 일 때만, 검출 침묵이면 20000 폴백.
    #     🚨 north 폴리곤(geofence_avoid_polygon)이 비면 /avoid_zone 늘 false → mode 5 에서 늘 20000 = lidar 와 같은 배 동작.
    #   'lidar' = 담당 모드에서 매 틱 20000(지금 north 폴백과 같은 동작). 이상값 → ERROR + lidar.
    #   옛 이름 'doridori' 는 'fused' 로 받고 WARN.
    avoid_mode: "fused"
    wp_mode_stale_sec: 1.0          # /wp_mode 마지막 수신 후 이 시간 넘으면 발행 중지 (north 주기 0.5 s 의 2배)
    avoid_zone_stale_sec: 1.0       # /avoid_zone 이 이 시간 넘게 묵으면 zone 밖(20000 + ERROR) — north 주기 0.5 s 의 2배
    # /avoid_detections 의 age_s(촬영→발행)가 이보다 크면 그 검출은 버린다. ⚠️ 실측 필요(검출기 U3 지연).
    #   근거: 노드는 수신 순간 자세로 지도에 넣는다 → 지연 동안 움직인 만큼 위치 오차. 0.5 s 면 주행 약 1 m/s 에서
    #   약 0.5 m(clear_low 0.45 수준), 도리도리 정지 촬영(dori_hold_s 1.2 s) 안에 여러 프레임이 남는다.
    det_max_age_s: 0.5
    active_wp_mode: 5
    period_sec: 0.1
    gps_stale_sec: 2.5
    yaw_stale_sec: 0.5
    detections_quiet_warn_sec: 5.0
    lidar_forward_deg: 80.0
    pitch_sign: 1.0                 # ⚠️ /imu/data 피치 부호: 선수 숙임 = 양수가 되게
    roll_sign: 1.0                  # ⚠️ /imu/data 롤 부호: 우현 아래 = 양수가 되게
    # /imu/data 마지막 수신 뒤 이 시간 넘으면 IMU 피치·롤을 0 으로(장착 cam_pitch_deg·cam_roll_deg 만) + 5 s 주기 WARN.
    #   iahrs 는 지금 /imu/data 를 발행하지 않는다(11-14 결정 — 수정 불가) → '한 번도 못 받음' WARN 1회가 정상이고,
    #   주기 WARN 은 받다가 끊긴 경우만. 묵은 자세로 단안 거리를 내지 않으려는 것. ⚠️ /imu/data 주기 미확인(발행 안 됨)
    imu_stale_sec: 1.0
    virtual_extra_m: 0.2
    half_l: 0.83
    half_w: 0.285
    low_r: 0.2                      # LiDAR 연관 없는 카메라 단독 트랙 반경(obstacle_requires_lidar false 경로)
    buoy_r: 0.12
    # 흰 장애물 반경 ⚠️ 가정(지름 0.5 m — 규정에 지름 없음, 운영측 미회신). 회피 여유 계산 + LiDAR 폭 검사
    #   반경(max(buoy_r, obstacle_r)). 흰 지름이 약 1.2 m 를 넘으면 폭 검사 상한이 부족 → 실측 후 교체.
    obstacle_r: 0.25
    default_half_width_m: 1.5
    clear_low: 0.45
    clear_wall: 0.35
    guard_m: 0.15
    stop_lead_s: 0.6
    dori_angle_deg: 60.0
    dori_tol_deg: 4.0
    dori_lead_s: 0.3
    dori_settle_s: 0.3
    dori_hold_s: 1.2
    dori_sweep_margin_m: 0.25
    dori_defer_max_m: 1.5
    dori_explore_m: 3.0
    dori_timeout_s: 25.0
    stop_speed: 0.05
    look_m: 1.5
    turn_in_m: 2.5
    max_steer_deg: 60.0
    step_deg: 10.0
    # 안전 헤딩 탐색의 선회 응답 이득(1/s) — 선회율 ≈ 이 값 × (B) 상대각(1차 응답 예측). 0.0 = 즉시 선회 가정(W2 이전).
    #   ⚠️ 실측 필요(시뮬 ship_direction→motor_control 기준 0.54/s 를 느린 쪽으로 0.5). 실물이 더 빨리 돌면 일찍 꺾는 쪽 = 안전.
    turn_gain_per_s: 0.5
    cam_h: 0.415                    # OAK 렌즈 수면 위 높이 — 설계값(mast v2), 실측 아님 ⚠️ (두 배 공통, perception_fusion oak_cam_h_m 와 같은 값)
    cam_pitch_deg: 11.0             # OAK 아래로 숙인 각 — 설계값(mast v2), 실측 아님 ⚠️ (두 배 공통, oak_pitch_deg 와 같은 값)
    cam_roll_deg: 0.0               # 장착 롤(우현 아래 +) ⚠️ 실측
    cam_h_sigma_m: 0.05             # 카메라 수면 높이 σ ⚠️ 가정 — σd/d = σh/h
    pixel_sigma: 0.004              # 바닥 행·열 σ, 정규 좌표(px / fy). 0.004 ≈ 2 px / fy 513(OAK 640×360 HFOV 63.9°) ⚠️
    bearing_sigma_deg: 0.7
    pitch_sigma_hold: 0.5
    pitch_sigma_move: 2.0
    pos_sigma: 0.03
    range_sigma_rel: 0.03
    max_range: 8.0
    confirm_n: 3
    red_ratio: 0.6
    wall_fill_step: 0.15
    # LiDAR 연관 거리 여유(|LiDAR − 카메라 거리| ≤ 3σ + 이 값) · 트랙 앵커(원래 LiDAR 점)에서 같은 물체로 볼 반경
    #   (확정 장애물 점을 벽·부표에서 뺀다 — 앵커 기준이라 obstacle_r 를 키워도 안 꺼짐) · 통로 밖 판정 여유
    buoy_match_m: 0.35
    # 흰 장애물 = LiDAR 군집 + 카메라 색 표 (계약서_흰부표_거리융합_v3_20261114 W2·W2b)
    #   obstacle_match_deg: 카메라 방위 ↔ LiDAR 점 방위 허용 ⚠️ 가정. 검출 방위 3σ(0.7° → 2.1°) + LiDAR 군집 중심 양자화
    #     + 회전 중 지연·파도 롤 여유 → 6.5. 🚨 OAK yaw 장착 치우침(1번배 약 −4° 추정)은 이 창으로 못 고친다 —
    #     시뮬 −4° 에서 5·6.5·7·9° 모두 놓침 16~30/80. 치우침은 cam_yaw_offset_deg 로.
    #   cam_yaw_offset_deg: OAK yaw 장착 보정 — 검출 방위(좌 +)에 더함. 카메라가 왼쪽으로 φ 돌아 달렸으면 +φ
    #     (방위가 4° 오른쪽으로 나오면 +4.0). ⚠️ 실측 필요, 배별 값 — 배별 통로(launch boat → yaml) 없음 → 공용 0.0.
    #   obstacle_requires_lidar: true = LiDAR 연관 없는 cls 0 은 지도에 안 넣음(흰 HSV 오검출 방어, 11-14 결정 (나) 유지).
    #     false = LiDAR 연관 없는 cls 0 도 카메라 거리(D455, 없으면 단안)로 지도에(반경 low_r). R1 폐기(빨강도 LiDAR 에
    #     보임)로 'LiDAR 에 안 보이는 장애물' 경우가 없어 쓸 곳이 없고, 흰 HSV 오검출이 확정 유령이 될 수 있다.
    #     🚨 롤백 수단이 아니다 — 회피를 예전처럼 하려면 avoid_mode: "lidar".
    obstacle_match_deg: 6.5
    cam_yaw_offset_deg: 0.0
    obstacle_requires_lidar: true

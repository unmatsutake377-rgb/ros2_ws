# ship_gate 파라미터 (하드코딩 금지, CLAUDE.md 1-4)
/ship_gate:
  ros__parameters:
    # 게이트 접근(mode 0)부터 비전 사용 → 정렬 시간 확보 (작년엔 mode 0 을 ship_last 가 잡았다).
    # ship_last 는 6b 에서 제거됨 → mode 0 은 이제 ship_gate 단독. (발행자 둘 충돌 없음)
    active_wp_modes: [0, 1]
    period_sec: 0.1

    # ---- 게이트 쌍 제약 [3] ----
    # '다음 게이트 빨강' + '이번 게이트 초록'이 같이 보이면 둘의 중간으로 가버린다(엉뚱).
    pair_min_sep_deg: 5.0    # 이보다 붙어 있으면 같은 게이트 아님(중복 검출)
    pair_max_sep_deg: 80.0   # 이보다 벌어져 있으면 같은 게이트 아님(→ 가까운 쪽 하나만)
                             # (80 > 2×31.95 = 63.9(OAK HFOV) 이라 사실상 카메라 FOV 가 상한. 11-04 OAK 전환)
    single_offset_deg: 40.0  # 한쪽만 보일 때 게이트 중심 쪽으로 트는 각

    # 🚨 빨강이 좌현인가 — 한쪽만 보일 때 트는 방향을 정한다 [6]. 대회 규정 기본 true.
    #    부호 규약(11-04 확정): /red_angle·/green_angle 은 상대각, 왼쪽 양수(vision_geom.angle_from_pixel).
    #    /candidate_angle·LiDAR a−80 과 같은 부호. 빨강이 좌현이면 /red_angle > 0.
    #    🚨 false 로 '고치지' 말 것 — 파라미터 뜻이 거꾸로 된다. 대회 launch 가 이 yaml 을 넘기므로
    #       (11-05) 여기 값이 그대로 대회값이다 — false 면 한쪽만 보일 때 반대로 튼다.
    red_on_port: true

    # ---- 순차 통과 카운트 [4] → /gates_passed ----
    # 🚨 대회 launch(launch_files.launch.py) 가 ship_gate 에 이 yaml 을 넘긴다(11-05) → yaml 이 대회값.
    #    값을 바꿀 땐 ship_gate.py declare_parameter 기본값·gate_logic.GateCounter 기본 인자와 세 곳 동시에.
    pass_behind_deg: 28.0    # 부표 |상대각| 이 이 각을 넘으면 '통과' 로 카운트(폭 3/6/8 m 게이트 선 2.8/5.6/7.5 m 앞).
                             # 🚨 카메라 반화각(OAK hfov 63.9/2 = 31.95°) 보다 작아야 한다 — 부표는 그 밖에서
                             #    10000(안 보임)이 되어 75 는 영원히 안 온다(11-04). 가장자리 여유 3.95°(⚠️ 실측 필요:
                             #    블롭 잘림·y_zone 으로 실기 최대각은 32 보다 작을 수 있다 — 벤치 vision_probe 로
                             #    최대 |각| 먼저 재고, 모자라면 27 로. 11-04 OAK 전환 때 35(D455 반화각 40.16) → 28).
    cam_hfov_deg: 63.9       # 부팅 시 pass_behind_deg < 반화각 검사용. ⚠️ vision.yaml hfov_deg 와 같아야 한다(OAK 640×360 ISP 1/3).
    # arming 에 거리 조건 없음(⑥): 유효 쌍이 전방(두 |각| ≤ pass_behind_deg)이면 armed. (옛 gate_arm_dist_m(6 m)
    # 조건은 폭 6 m 게이트에서 arming 창이 0.9 m 로 짧고 7 m 이상이면 없으며, 게이트 사이 4 m 에선 다음 쌍
    # 거리(≈6 m)가 기준을 못 넘어 재-arming 이 막혔다 — 11-04 시뮬 간격 4 m 17/40. 제거.)
    rearm_far_margin_m: 1.0  # 카운트 뒤 재-arming: 전방 쌍의 LiDAR 거리가 '카운트 시점 거리 + 이 여유' 보다 멀면
                             # 새 게이트로 보고 다시 arming(또는 두 부표 모두 안 보이는 틱). 거리 미상이면 막지 않음.
                             # ⚠️ 실측 필요: 요잉 복귀 때 같은 부표의 LiDAR 거리 흔들림보다 커야 이중 카운트가 안 난다
                             #    — LiDAR 가 부표를 볼 때만. 거리 미상이면 재-arming 을 막지 않는다(이중 카운트 가능).
                             #    기준 거리는 arming 뒤 잰 값의 최소값(근접 부표를 놓쳐도 먼 값이 남지 않게).
                             # ⚠️ 한계: 카메라만으론 게이트 사이 거리 ≤ 6 m 에서 앞 게이트 부표가 보이는 채로 다음 쌍이
                             #    비슷한 거리에 들어와 누락 가능(11-04 시뮬 간격 9 m 40/40·8 m 40/40·6 m 35/40·
                             #    4 m 21/40, 이중 0). LiDAR 부표 추적은 대회 후 과제.
    lidar_match_half_deg: 3.0  # 부표 방위 ±이 각도의 LiDAR 최소거리 (부표는 점 물체라 매칭 통함)

    # ---- 신선도 ----
    angle_stale_sec: 0.7     # /red_angle·/green_angle 이 이보다 묵으면 '안 보임'
    scan_stale_sec: 1.0

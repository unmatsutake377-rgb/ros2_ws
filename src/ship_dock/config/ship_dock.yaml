# ship_dock 파라미터 (하드코딩 금지, CLAUDE.md 1-4)
/ship_dock:
  ros__parameters:
    active_wp_mode: 7        # 🚨 작년엔 9 였다 → 도킹 노드가 1년 내내 침묵했다 (CLAUDE.md 3-1)
    period_sec: 0.1

    # ---- 거리: 전부 LiDAR '전방 섹터 최소거리' 기준 ----
    # ★ 표식 방위의 LiDAR 거리를 찾지 않는다. 도크는 넓어서 표식(중앙) 방위와
    #   LiDAR 최근접점 방위가 최대 15° 어긋난다 → 매칭이 틀린다.
    #   "전방에 뭔가 얼마나 가까운가"만 알면 접안엔 충분하다. 각도 정합 문제가 사라진다.
    front_sector_half_deg: 15.0   # 정면 ±15° 섹터
    # 섹터 공간 median 창 (계약서_도킹물보라필터_20261109). 물보라 고립 반사 1~2 점을 지운다.
    #   🚨 정수로 쓸 것(5.0 이면 rclpy 타입 불일치로 노드가 안 뜬다). 0·1 = raw 최소(옛 동작, 롤백) /
    #   2~9 = median(짝수 k 는 창 k+1) / 범위 밖 → 부팅 ERROR + 5. 바꾸면 노드 재시작(param set 무효).
    #   코드 기본값(ship_dock.py)과 같게 유지 — 대회 launch 가 이 yaml 을 넘긴다(11-05)
    front_median_kernel: 5        # ⚠️ 실해역 확인 — 3 점 이상 덩어리 물보라는 못 거른다
    standoff_dist_m: 3.0          # ⚠️ 실측 필요 — 정면 정렬을 마칠 지점
    contact_dist_m: 1.0           # ⚠️ 실측 필요 — 접안 완료 (도크 규격 공지 후 확정)
    backoff_dist_m: 2.5           # ⚠️ 실측 필요 — 후진으로 빠져나올 거리

    # ---- 정렬 (정면 접근) ----
    align_tol_deg: 8.0            # 이 안에 들면 '정면'으로 본다
    realign_tol_deg: 25.0         # 접근 중 이만큼 틀어지면 제자리 재정렬 (비스듬한 접안 방지)
    realign_min_dist_m: 1.5       # ⚠️ 실측 필요 — 이 거리 안에서는 재정렬(제자리 선회) 안 함. contact_dist_m 바꾸면 같이 조정(contact + 0.5 권장)
                                  #   코드 기본값(ship_dock.py)과 같게 유지 — 대회 launch 가 이 yaml 을 넘긴다(11-05)
    image_positive_is_left: true  # ⚠️ 벤치 검증 필요 — /image_angle 양수가 좌현인가 (카메라 좌표계)
    sweep_right: true             # SEARCH 스윕 방향 (true=우선회 5000)

    # ---- 시간 ----
    init_wait_sec: 3.0
    search_timeout_sec: 60.0       # 일시적 놓침 재탐색 여유, mode 7 시간 초과 150 s 안 (이전 25)
    align_timeout_sec: 15.0
    approach_timeout_sec: 30.0
    contact_hold_sec: 3.0         # ⚠️ 규정 확인 — 접안 유지 시간
    backoff_timeout_sec: 8.0

    # ---- 신선도 (묵은 데이터로 도킹하지 않는다) ----
    image_stale_sec: 1.0
    scan_stale_sec: 1.0

    # ---- TRANSIT → INIT (mode 7 진입 = TRANSIT: 20000 으로 GPS 주행에 맡김) ----
    #   /goal_distance(north 현재 WP 까지 거리)가 신선하고 이 거리 미만이면 도킹 FSM(INIT) 시작.
    #   진입 후 1.0 s 지나 받은 값만 쓴다(직전 WP 거리 배제, 코드 상수). 모르면 TRANSIT 유지.
    #   코드 기본값(ship_dock.py)과 같게 유지 — 대회 launch 가 이 yaml 을 넘긴다(11-05, yaml 이 대회값)
    dock_engage_dist_m: 12.0      # ⚠️ 실측 필요 — 표식 인식 거리(12 m) 안에서 시작
    goal_dist_stale_sec: 2.0      # north 발행 주기 0.5 s × 4

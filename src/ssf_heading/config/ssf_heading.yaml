# yaw_mux — /imu/yaw 단독 발행자 (CLAUDE.md 3-5)
#
# 🚨 이 파일을 쓰기 전에 iahrs_driver 의 yaw_topic 이 /imu/yaw_raw 인지 확인할 것.
#    /imu/yaw 로 남아 있으면 발행자 2개가 되어 두 값이 번갈아 나온다 (에러는 안 난다).

yaw_mux:
  ros__parameters:
    # ------------------------------------------------------------ 소스 선택
    # imu_relative : 지금 유일하게 구현된 것. IMU 상대 yaw + mount_offset_deg 고정 보정.
    # cog_offset   : 옵션 B — GPS COG 로 오프셋 추정 (N2, 미구현)
    # dual_gps     : 옵션 A — 듀얼 F9P relPosNED   (N3, 보드 확보 후)
    # imu_absolute : 옵션 C — IMU 지자기 절대 heading (N4, 드라이버 조사 후)
    # 미구현 소스를 고르면 조용히 0 을 내지 않고 발행을 멈춘다 (NOT_IMPLEMENTED).
    heading_source: "imu_relative"

    period_sec: 0.02        # 50Hz. 드라이버는 100Hz, 소비자(ship_goal_angle)는 20Hz
    stale_sec: 0.5          # 이 시간 넘게 원시 yaw 가 끊기면 발행 중단

    # ------------------------------------------------------------ ⚠️ 전부 실측 필요
    # 벤치 절차 (배 완성 후, 물 밖에서):
    #   1) 배를 나침반으로 정북에 맞춰 놓는다
    #   2) ros2 topic echo /imu/yaw 가 0 을 읽을 때까지 mount_offset_deg 를 조정
    #   3) 뱃머리를 시계방향(동쪽)으로 90° 돌린다 → 값이 90 으로 '증가' 해야 한다.
    #      감소하면 invert_yaw: true 로 바꾸고 2) 부터 다시.
    # 🚨 부호가 틀리면 배가 정반대로 간다. 지금 값은 추측이 아니라 '아직 안 쟀다' 는 뜻의 0 이다.
    invert_yaw: false
    mount_offset_deg: 0.0

    # 자기북 → 진북 보정. 한국 약 -8°.
    # ⚠️ heading_source 가 imu_absolute(지자기) 일 때만 적용된다.
    #    dual_gps / cog_offset 는 이미 진북 기준이라 여기 값을 넣어도 무시된다 (이중보정 방지).
    #    imu_relative 는 기준축이 임의라 mount_offset_deg 가 전부 흡수한다 — 역시 무시.
    magnetic_declination_deg: 0.0

    # ------------------------------------------------------------ 옵션 B (COG 오프셋, N2)
    # heading_source 가 cog_offset 이 아니어도 추정은 돌아간다.
    # /heading_status 로 "지금 전환하면 쓸 만한가" 를 물 위에서 미리 볼 수 있다:
    #   cog_offset:OK  n=142 R=0.97 off=37.4 rej=-
    #                  └표본  └신뢰도    └추정 오프셋  └마지막 배제 사유
    # R(원형 결과길이) 0~1. 1 에 가까울수록 표본이 한 방향으로 모임 = 믿을 만함.
    #
    # 🚨 옵션 B 의 원리적 한계: COG 는 '간 방향' 이지 '뱃머리' 가 아니다.
    #    조류·바람에 게걸음하면 그 각도가 offset 에 통째로 흡수된다.
    #    즉 이 추정치 = 장착 오프셋 + 그날의 평균 게걸음각.
    #    물살이 일정하면 실용상 문제없다. 절대 헤딩이 정말 필요하면 옵션 A(듀얼 F9P)다.

    cog_min_speed_mps: 0.8      # 이보다 느리면 COG 는 노이즈 → 표본 배제
                                #   (작년 드라이버는 g_speed 를 안 봐서 속도 0 에서도 통과했다)
    cog_max_turn_rate_dps: 8.0  # 선회 중엔 COG 가 뱃머리를 못 따라온다 → 표본 배제
    cog_min_samples: 30.0       # 이만큼 모여야 수렴 인정
    cog_min_resultant: 0.9      # R 이 이 아래면 못 믿는다 (후진 180° 뒤집힘이 여기서 걸린다)
    cog_half_life_sec: 60.0     # 오래된 표본 감쇠 반감기. IMU 드리프트를 따라간다

    # 🚨 후진 게이트. R 로는 후진을 못 막는다.
    #    전·후진이 '섞이면' R 이 무너져 걸리지만, **후진만 일관되게** 지속되면
    #    표본이 서로 일치한 채 전부 180° 틀려서 R=1.0 으로 정반대 offset 에 수렴한다.
    #    (검산: 후진만 60표본 → R=1.000, offset 217°(참값 37°))
    #    전진이 쌓인 뒤의 짧은 후진은 R 이 임계 아래로 내려가 '침묵' 으로 실패하지만
    #    (60s 전진 후 3s 후진 → R=0.868), 냉시작 직후 후진은 그대로 뚫린다.
    #    → motor_control 이 /motor_reverse(Bool) 를 발행한다. 모르면 안 모은다.
    #    ⚠️ true 인데 motor_control 이 안 떠 있으면 영구히 수렴하지 않는다.
    #       그 상태는 /heading_status 의 rej=no_reverse_gate 와 경고 로그로 보인다.
    #       헤딩만 벤치할 때는 false 로.
    cog_require_reverse_gate: true

    # 🚨 포화 함정: 감쇠가 있으면 표본수 상한이 n_max = 1/(1-0.5^(dt/half_life)) 다.
    #    cog_min_samples 를 그 위로 잡으면 **영원히 수렴하지 않는다 — 에러도 없이.**
    #    예: GPS 10Hz + half_life 1s → n_max ≈ 14.9. min_samples 20 이면 절대 못 넘는다.
    #    yaw_mux 가 부팅 때 이 조합을 검사해 ERROR 로그를 낸다. gps_rate_hz 는 그 검사용.
    gps_rate_hz: 5.0
    # 현재값 검사: dt=0.2, half_life=60 → n_max ≈ 433 ≫ 30. 여유 충분.

    # ------------------------------------------------------------ 토픽
    raw_yaw_topic: "/imu/yaw_raw"   # iahrs_driver 가 내는 보정 전 상대 yaw
    yaw_topic: "/imu/yaw"           # 소비자 계약 (CLAUDE.md 1-3, 이름 변경 금지)
    gps_vel_topic: "/ublox_gps_node/fix_velocity"
    motor_reverse_topic: "/motor_reverse"   # motor_control 이 발행 (PWM 규약 소유자)

    # 🚨 GPS 속도벡터 프레임. 틀리면 헤딩이 90° 돌거나 좌우가 뒤집힌다.
    #      enu (ROS 표준, ublox 기본): x=동, y=북
    #      ned                       : x=북, y=동
    #
    #    ★ 벤치 판별 절차 (한 방향만으론 부족하다 — 축 스왑이 우연히 통과할 수 있다):
    #        정북 직진 → off 안정값 기록 → 정동 직진 → off 안정값 기록.
    #        두 값이 동일(±수 °)하면 프레임 정상. 다르면 enu/ned 또는 부호 오류 — 전환 금지.
    #
    #    ⚠️ 두 방향으로도 못 잡는 경우가 하나 있다: x·y 가 **둘 다** 부호 반전이면
    #       두 방향 모두 180° 어긋나 '동일한 off' 로 보인다.
    #       → off 의 절대값이 mount_offset_deg 예상치(IMU 를 어느 방향으로 달았나)와
    #         맞는지로 거른다. 180° 어긋나 있으면 부호 반전이다.
    gps_vel_frame: "enu"

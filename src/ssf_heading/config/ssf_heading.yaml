# yaw_mux — /imu/yaw 단독 발행자 (CLAUDE.md 3-5)
#
# 🚨 이 파일을 쓰기 전에 iahrs_driver 의 yaw_topic 이 /imu/yaw_raw 인지 확인할 것.
#    /imu/yaw 로 남아 있으면 발행자 2개가 되어 두 값이 번갈아 나온다 (에러는 안 난다).

yaw_mux:
  ros__parameters:
    # ------------------------------------------------------------ 소스 선택
    # imu_relative : 지금 유일하게 구현된 것. IMU 상대 yaw + mount_offset_deg 고정 보정.
    # cog_offset   : 옵션 B — GPS COG 로 오프셋 추정 (N2, 미구현)
    # dual_gps     : 옵션 A — 듀얼 F9P relPosNED   (N3, 보드 확보 후)
    # imu_absolute : 옵션 C — IMU 지자기 절대 heading (N4, 드라이버 조사 후)
    # 미구현 소스를 고르면 조용히 0 을 내지 않고 발행을 멈춘다 (NOT_IMPLEMENTED).
    heading_source: "imu_relative"

    period_sec: 0.02        # 50Hz. 드라이버는 100Hz, 소비자(ship_goal_angle)는 20Hz
    stale_sec: 0.5          # 이 시간 넘게 원시 yaw 가 끊기면 발행 중단

    # ------------------------------------------------------------ ⚠️ 전부 실측 필요
    # 벤치 절차 (배 완성 후, 물 밖에서):
    #   1) 배를 나침반으로 정북에 맞춰 놓는다
    #   2) ros2 topic echo /imu/yaw 가 0 을 읽을 때까지 mount_offset_deg 를 조정
    #   3) 뱃머리를 시계방향(동쪽)으로 90° 돌린다 → 값이 90 으로 '증가' 해야 한다.
    #      감소하면 invert_yaw: true 로 바꾸고 2) 부터 다시.
    # 🚨 부호가 틀리면 배가 정반대로 간다. 지금 값은 추측이 아니라 '아직 안 쟀다' 는 뜻의 0 이다.
    invert_yaw: false
    mount_offset_deg: 0.0

    # 자기북 → 진북 보정. 한국 약 -8°.
    # ⚠️ heading_source 가 imu_absolute(지자기) 일 때만 적용된다.
    #    dual_gps / cog_offset 는 이미 진북 기준이라 여기 값을 넣어도 무시된다 (이중보정 방지).
    #    imu_relative 는 기준축이 임의라 mount_offset_deg 가 전부 흡수한다 — 역시 무시.
    magnetic_declination_deg: 0.0

    # ------------------------------------------------------------ 토픽
    raw_yaw_topic: "/imu/yaw_raw"   # iahrs_driver 가 내는 보정 전 상대 yaw
    yaw_topic: "/imu/yaw"           # 소비자 계약 (CLAUDE.md 1-3, 이름 변경 금지)
